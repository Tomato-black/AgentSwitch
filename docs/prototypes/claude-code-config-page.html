<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 接入与 Claude Code 设置 · 交互原型</title>
<style>
  :root{
    --bg:#FFFFFF;
    --sidebar:#F5F5F7;
    --border:#E4E4E9;
    --text:#18181B;
    --muted:#6B6B73;
    --accent:#F97316;
    --accent-hover:#EA620A;
    --accent-text:#18181B;
    --success:#16A34A;
    --warning:#B45309;
    --danger:#DC2626;
    --soft-act:#FFF1E6;
    --soft-act-text:#C2410C;
    --soft-ok:#E8F7EE;
    --soft-ok-text:#007634;
    --soft-warn:#FEF3C7;
    --soft-warn-text:#A64A00;
    --soft-danger:#FEE2E2;
    --soft-danger-text:#B91C1C;
    --soft-gray:#EFEFF2;
    --soft-gray-text:#52525B;
    --selected:#E4E4EA;
    --radius-card:12px;
    --radius-control:8px;
    --shadow-card:0 1px 0 rgba(24,24,27,.02), 0 1px 3px rgba(24,24,27,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#ECECF1;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .mono{font-family:Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
  .muted{color:var(--muted)}
  .grow{flex:1}
  .icon{display:inline-flex;align-items:center;justify-content:center}
  .icon svg{width:16px;height:16px;display:block}

  /* ---------- prototype bar ---------- */
  .demo-bar{
    height:40px;background:#18181B;color:#E4E4E7;display:flex;align-items:center;gap:10px;
    padding:0 16px;font-size:12px;position:relative;z-index:10;
  }
  .demo-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .demo-bar strong{font-weight:600;color:#fff}
  .demo-bar .sep{width:1px;height:15px;background:#3F3F46;margin:0 2px}
  .demo-bar .demo-hint{color:#A1A1AA}
  .demo-bar .grow{flex:1}
  .demo-bar button{
    height:26px;border:1px solid #3F3F46;border-radius:7px;background:transparent;color:#E4E4E7;
    padding:0 9px;font-size:12px;
  }
  .demo-bar button:hover{background:#2C2C31}

  /* ---------- shell ---------- */
  .app{
    display:flex;height:calc(100vh - 40px);min-height:620px;background:var(--bg);overflow:hidden;
  }
  .sidebar{
    width:200px;flex:0 0 200px;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:12px 8px 10px;
  }
  .brand{display:flex;align-items:center;gap:8px;padding:4px 6px 14px}
  .logo{
    width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-text);
    display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.4px;
  }
  .brand-name{font-weight:700;font-size:13px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;
    border:0;background:transparent;color:var(--text);text-align:left;width:100%;
  }
  .nav-item:hover{background:#ECECF1}
  .nav-item.active{background:var(--selected);font-weight:600}
  .nav-item.active .icon{color:var(--accent)}
  .nav-item .icon{color:var(--muted);flex:0 0 16px}
  .nav-item .nav-label{flex:1}
  .nav-item .nav-badge{
    font-size:10px;font-weight:500;color:var(--soft-act-text);background:var(--soft-act);
    border-radius:999px;padding:1px 6px;
  }
  .gateway{
    margin-top:auto;border-top:1px solid var(--border);padding:12px 6px 4px;
    display:flex;flex-direction:column;gap:6px;
  }
  .gw-row{display:flex;align-items:center;gap:7px;font-size:12px}
  .led{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
  .gateway .addr{font-size:11px}
  .gateway .btn{height:28px;font-size:12px;justify-content:center}

  .main{flex:1;overflow:auto;padding:16px 24px 44px}
  .page{max-width:920px;margin:0 auto}

  /* ---------- agent tabs / merged access card ---------- */
  .agent-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 12px;flex-wrap:wrap}
  .agent-tab{
    border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;
    margin-bottom:-1px;font-size:13px;display:inline-flex;align-items:center;gap:6px;
  }
  .agent-tab:hover{color:var(--text)}
  .agent-tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
  .agent-tab .badge{height:18px;font-size:10px}
  .access-card{
    border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff;
    box-shadow:var(--shadow-card);display:flex;gap:14px;align-items:flex-start;
  }
  .access-main{flex:1;min-width:0}
  .access-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
  .access-title .badge{font-weight:500}
  .access-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:6px;align-items:center}
  .access-meta b{color:var(--text);font-weight:600}
  .access-meta .led{width:7px;height:7px}
  .access-note{color:var(--muted);font-size:11.5px;margin-top:7px;line-height:1.5}
  .access-actions{display:flex;gap:7px;align-items:center;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  .btn.act{background:var(--soft-act);border-color:transparent;color:var(--soft-act-text);font-weight:600}
  .btn.act:hover{background:#FFE4D1}
  .section-head{display:flex;align-items:flex-start;gap:10px;margin:18px 0 10px}
  .section-title{font-size:14px;font-weight:700;letter-spacing:-.1px}
  .section-desc{color:var(--muted);font-size:11.5px;margin-top:2px}
  .section-head .badge{margin-left:auto;flex:0 0 auto}
  .managed-more{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:8px;background:#FCFCFD}
  .managed-more summary{cursor:pointer;color:var(--muted);font-size:11.5px;list-style:none}
  .managed-more summary::-webkit-details-marker{display:none}
  .managed-more summary:hover{color:var(--text)}
  .managed-more summary .chev{display:inline-block;transition:transform .15s;margin-right:4px}
  .managed-more[open] summary .chev{transform:rotate(180deg)}

  /* ---------- access drawer ---------- */
  .drawer-overlay{position:fixed;inset:0;background:rgba(24,24,27,.28);z-index:40}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;z-index:41;
    border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(24,24,27,.16);
    display:flex;flex-direction:column;
  }
  .drawer-head{padding:16px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
  .drawer-title{font-size:15px;font-weight:700}
  .drawer-sub{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45}
  .drawer-close{margin-left:auto;flex:0 0 auto;font-size:18px;line-height:1;width:28px;height:28px}
  .drawer-body{flex:1;overflow:auto;padding:14px 18px 20px}
  .drawer-foot{border-top:1px solid var(--border);padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;background:#fff}
  .access-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #F1F1F4}
  .access-row:first-child{border-top:0}
  .access-label{width:96px;flex:0 0 96px;color:var(--muted);font-size:12px}
  .access-row .select,.access-row .input{flex:1;min-width:0}
  .access-row .check{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .access-row .check input{accent-color:var(--accent);width:14px;height:14px}
  .role-grid{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;align-items:center;margin-top:4px}
  .role-grid .role-label{color:var(--muted);font-size:12px}
  .role-grid .select{height:30px;font-size:12px}
  .key-preview{
    background:#18181B;color:#E4E4E7;border-radius:10px;padding:10px 12px;font-family:Menlo,Consolas,monospace;
    font-size:11px;line-height:1.7;overflow:auto;max-height:220px;margin:5px 0 0;white-space:pre;
  }
  .key-preview .k{color:#93C5FD}
  .key-preview .v{color:#FDBA74}
  .key-preview .c{color:#A1A1AA}
  .global-box{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#FCFCFD;margin-top:6px}
  .global-box .row{display:flex;gap:8px;font-family:Menlo,Consolas,monospace;font-size:10.5px;color:#52525B;padding:2px 0}

  /* ---------- header ---------- */
  .page-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}
  .page-title{font-size:16px;font-weight:700;margin:0 0 3px;letter-spacing:-.1px}
  .page-sub{color:var(--muted);font-size:13px}
  .page-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .btn{
    height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--border);background:#fff;
    color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{background:#F4F4F5}
  .btn.small{height:28px;padding:0 9px;font-size:12px}
  .btn.primary{
    background:var(--accent);border-color:var(--accent);color:var(--accent-text);
    border-radius:999px;font-weight:600;padding:0 18px;
  }
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.primary:disabled{
    background:#F4F4F5;border-color:var(--border);color:#A1A1AA;cursor:not-allowed;font-weight:500;
  }
  .btn.danger{background:var(--soft-danger);border-color:transparent;color:var(--soft-danger-text)}
  .btn.danger:hover{background:#FDD5D5}
  .text-btn{
    border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;
  }
  .text-btn:hover{background:#F4F4F5;color:var(--text)}
  .link-btn{border:0;background:transparent;color:#0A6CD6;padding:1px 3px;font-size:12px}
  .link-btn:hover{text-decoration:underline}

  /* ---------- banners / file strip ---------- */
  .banner{
    display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:10px;
    font-size:12px;margin-bottom:12px;border:1px solid transparent;
  }
  .banner.info{background:#F7F7F9;border-color:#EFEFF2;color:#52525B}
  .banner.warn{background:var(--soft-warn);border-color:#FDE68A;color:var(--soft-warn-text)}
  .banner.danger{background:var(--soft-danger);border-color:#FECACA;color:var(--soft-danger-text)}
  .banner.ok{background:var(--soft-ok);border-color:#BBF7D0;color:var(--soft-ok-text)}
  .banner .icon{margin-top:1px;flex:0 0 16px}
  .banner b{font-weight:600}
  .file-strip{
    display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;margin-bottom:12px;background:#FCFCFD;min-height:38px;
  }
  .file-strip .path{color:#52525B;word-break:break-all}
  .file-strip .spacer{flex:1}
  .file-strip .last{color:var(--muted);font-size:11px;white-space:nowrap}

  /* ---------- segmented / tabs ---------- */
  .segmented{
    display:flex;gap:4px;background:#F5F5F7;border:1px solid var(--border);border-radius:10px;
    padding:3px;margin-bottom:12px;
  }
  .seg-btn{
    flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;color:var(--muted);
    text-align:center;line-height:1.25;
  }
  .seg-btn:hover{color:var(--text)}
  .seg-btn.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.08)}
  .seg-sub{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:1px}
  .seg-btn .lock-inline{display:inline-flex;vertical-align:-2px;margin-right:2px}

  .context-card{
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;
    box-shadow:var(--shadow-card);
  }
  .context-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .context-label{color:var(--muted);width:44px;flex:0 0 44px;font-size:12px}
  .context-row .select{max-width:430px}
  .file-tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .file-tab{
    border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 9px;color:var(--muted);
    font-size:12px;display:inline-flex;align-items:center;gap:6px;
  }
  .file-tab:hover{background:#F7F7F9;color:var(--text)}
  .file-tab.active{background:var(--selected);border-color:var(--selected);color:var(--text);font-weight:600}
  .path-line{
    font-family:Menlo,Consolas,monospace;font-size:11.5px;color:#52525B;background:#F7F7F9;
    border:1px solid #EFEFF2;border-radius:8px;padding:7px 10px;margin-top:8px;word-break:break-all;
  }
  .context-note{color:var(--muted);font-size:12px;margin-top:7px}

  .view-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin:0 0 12px}
  .view-tab{
    border:0;background:transparent;padding:8px 10px;color:var(--muted);border-bottom:2px solid transparent;
    margin-bottom:-1px;font-size:13px;
  }
  .view-tab:hover{color:var(--text)}
  .view-tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
  .view-tabs .spacer{flex:1}

  /* ---------- cards / forms ---------- */
  .card{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;
    box-shadow:var(--shadow-card);
  }
  .card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px}
  .card-title{font-weight:700;font-size:13px}
  .card-desc{color:var(--muted);font-size:12px;margin-top:2px}
  .card-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .form-row{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-top:1px solid #F1F1F4}
  .form-row:first-child{border-top:0}
  .form-row:first-of-type{border-top:0}
  .form-label{width:112px;flex:0 0 112px;color:var(--muted);padding-top:7px;font-size:12.5px;display:flex;align-items:center;gap:4px}
  .form-control{flex:1;min-width:0}
  .x-mini{
    width:16px;height:16px;border:0;border-radius:50%;background:transparent;color:#A1A1AA;
    font-size:14px;line-height:1;display:inline-grid;place-items:center;padding:0;
  }
  .x-mini:hover{background:var(--soft-danger);color:var(--soft-danger-text)}
  .input,.select,.textarea{
    width:100%;height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;
    padding:0 10px;color:var(--text);font-size:13px;min-width:0;
  }
  .input.mono{font-family:Menlo,Consolas,monospace;font-size:12px}
  .input:focus,.select:focus,.textarea:focus{
    outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);
  }
  .input:disabled,.select:disabled{
    background:#F7F7F9;color:#A1A1AA;cursor:not-allowed;
  }
  .textarea{height:auto;min-height:96px;padding:8px 10px;resize:vertical;line-height:1.6}
  .inline-control{display:flex;gap:6px;align-items:center}
  .inline-control .input{flex:1}
  .hint{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.45}
  .hint.warn{color:var(--soft-warn-text)}
  .hint.error{color:var(--soft-danger-text)}
  .hint.ok{color:var(--soft-ok-text)}
  .inherit-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:32px}
  .inherit-line .value{color:#52525B}
  .advanced-note{
    margin-top:9px;padding:8px 10px;border-radius:9px;background:#F7F7F9;border:1px solid #EFEFF2;
    color:var(--muted);font-size:11.5px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;
  }
  .advanced-note .icon{margin-top:1px}

  .badge{
    display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;
    font-size:10.5px;white-space:nowrap;background:var(--soft-gray);color:var(--soft-gray-text);
    font-weight:500;line-height:1;
  }
  .badge svg{width:11px;height:11px}
  .badge.ok{background:var(--soft-ok);color:var(--soft-ok-text)}
  .badge.warn{background:var(--soft-warn);color:var(--soft-warn-text)}
  .badge.danger{background:var(--soft-danger);color:var(--soft-danger-text)}
  .badge.act{background:var(--soft-act);color:var(--soft-act-text)}
  .badge.lock{background:#EFEFF2;color:#52525B}
  .badge.plain{background:transparent;color:var(--muted);padding:0}

  .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:8px;
    padding:3px 7px;background:#fff;font-size:11.5px;max-width:100%;
  }
  .chip.mono{font-family:Menlo,Consolas,monospace;font-size:11px}
  .chip .x{
    border:0;background:transparent;color:#A1A1AA;font-size:14px;line-height:1;padding:0;
    width:15px;height:15px;display:inline-grid;place-items:center;border-radius:50%;
  }
  .chip .x:hover{background:var(--soft-danger);color:var(--soft-danger-text)}
  .chip .x:disabled{opacity:.28;cursor:default}
  .chip .x:disabled:hover{background:transparent;color:#A1A1AA}
  .chip.muted{background:#F7F7F9;color:var(--muted)}
  .chip.soft-warn{background:var(--soft-warn);border-color:#FDE68A;color:var(--soft-warn-text)}
  .chip.soft-ok{background:var(--soft-ok);border-color:#BBF7D0;color:var(--soft-ok-text)}
  .chip.soft-danger{background:var(--soft-danger);border-color:#FECACA;color:var(--soft-danger-text)}
  .chip .mini-src{font-size:9.5px;color:#71717A;background:#F4F4F5;border-radius:999px;padding:1px 5px}

  .tri{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;height:30px;background:#fff}
  .tri button{
    border:0;border-right:1px solid var(--border);background:#fff;padding:0 10px;color:var(--muted);
    font-size:12px;min-width:44px;
  }
  .tri button:last-child{border-right:0}
  .tri button:hover{background:#F7F7F9;color:var(--text)}
  .tri button:disabled{opacity:.42;cursor:not-allowed}
  .tri button:disabled:hover{background:transparent;color:var(--muted)}
  .tri button.active{background:var(--selected);color:var(--text);font-weight:600}
  .tri button.on.active{background:var(--accent);color:var(--accent-text)}

  .rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
  .rule-group{border:1px solid var(--border);border-radius:10px;padding:9px;background:#FCFCFD;min-width:0}
  .rule-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .rule-title{font-weight:600;font-size:12px}
  .rule-count{margin-left:auto;color:var(--muted);font-size:10.5px}
  .rule-add{display:flex;gap:5px;margin-top:7px}
  .rule-add .input{height:28px;font-size:11.5px}
  .rule-add .btn{height:28px;padding:0 8px;font-size:11.5px}
  .eval-flow{display:flex;align-items:stretch;gap:7px;margin:9px 0}
  .eval-step{flex:1;border:1px solid var(--border);border-radius:9px;padding:7px 9px;background:#fff;min-width:0}
  .eval-step .step-num{font-size:10px;color:var(--muted)}
  .eval-step .step-name{font-weight:700;font-size:12px}
  .eval-step.deny{border-color:#FECACA;background:#FFF7F7}
  .eval-step.ask{border-color:#FDE68A;background:#FFFCF2}
  .eval-step.allow{border-color:#BBF7D0;background:#F7FCF8}
  .eval-arrow{display:flex;align-items:center;color:#A1A1AA;font-size:12px;flex:0 0 auto}
  .eval-note{color:var(--muted);font-size:11.5px;line-height:1.5}

  .env-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .env-table th{
    text-align:left;font-size:10.5px;font-weight:500;color:var(--muted);padding:3px 6px;
    border-bottom:1px solid var(--border);
  }
  .env-table td{padding:5px 6px;border-bottom:1px solid #F4F4F6;vertical-align:middle}
  .env-table tr:last-child td{border-bottom:0}
  .env-table .col-key{width:34%}
  .env-table .col-val{width:auto}
  .env-table .col-src{width:90px}

     1. 基础工具

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr = (v) => esc(v).replace(/`/g, '&#96;');
  const mono = (v) => `<span class="mono">${esc(v)}</span>`;
  const pad2 = (n) => String(n).padStart(2, '0');
  const nowClock = () => {
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const basename = (p) => {
    const clean = String(p || '').replace(/[\\/]+$/, '');
    const parts = clean.split(/[\\/]/);
    return parts[parts.length - 1] || clean;
  };
  const hasAt = (obj, path) => {
    if (!path) return false;
    let cur = obj;
    for (const part of path.split('.')) {
      if (!isObj(cur) && !Array.isArray(cur)) return false;
      if (!Object.prototype.hasOwnProperty.call(cur, part)) return false;
      cur = cur[part];
    }
    return true;
  };
  const getAt = (obj, path) => {
    if (!path) return undefined;
    let cur = obj;
    for (const part of path.split('.')) {
      if (cur === null || cur === undefined) return undefined;
      if (!Object.prototype.hasOwnProperty.call(cur, part)) return undefined;
      cur = cur[part];
    }
    return cur;
  };
  const setAt = (obj, path, value) => {
    const parts = path.split('.');
    let cur = obj;
    parts.forEach((part, i) => {
      if (i === parts.length - 1) cur[part] = value;
      else {
        if (!isObj(cur[part]) && !Array.isArray(cur[part])) cur[part] = {};
        cur = cur[part];
      }
    });
  };
  const deleteAt = (obj, path) => {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!isObj(cur[parts[i]]) && !Array.isArray(cur[parts[i]])) return;
      cur = cur[parts[i]];
    }
    delete cur[parts[parts.length - 1]];
  };
  const diffPaths = (a, b, prefix = '') => {
    const out = [];
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);

      const path = prefix ? `${prefix}.${k}` : k;
      const va = a ? a[k] : undefined;
      const vb = b ? b[k] : undefined;
      if (isObj(va) && isObj(vb)) out.push(...diffPaths(va, vb, path));
      else if (JSON.stringify(va) !== JSON.stringify(vb)) out.push(path);
    }
    return out;
  };

  function mergedDoc() {
    const out = {};
    for (const src of activeSources()) {
      const doc = docs[src];
      if (!isObj(doc)) continue;
      for (const [key, value] of Object.entries(doc)) {
        if (key === 'permissions' && isObj(value)) {
          if (!isObj(out.permissions)) out.permissions = {};
          for (const [pk, pv] of Object.entries(value)) {
            if (['allow', 'ask', 'deny', 'additionalDirectories'].includes(pk) && Array.isArray(pv)) {

              for (const item of pv) {

              }
            } else if (!Object.prototype.hasOwnProperty.call(out.permissions, pk)) {
              out.permissions[pk] = clone(pv);
            }
          }
        } else if (key === 'env' && isObj(value)) {
          if (!isObj(out.env)) out.env = {};
          for (const [ek, ev] of Object.entries(value)) {
            if (!Object.prototype.hasOwnProperty.call(out.env, ek)) out.env[ek] = ev;
          }
        } else if (key === 'hooks' && isObj(value)) {

          for (const [id, enabled] of Object.entries(value)) {
            if (!Object.prototype.hasOwnProperty.call(out.enabledPlugins, id)) out.enabledPlugins[id] = enabled;

          if (!isObj(out.skillOverrides)) out.skillOverrides = {};
          for (const [name, skillState] of Object.entries(value)) {
            if (!Object.prototype.hasOwnProperty.call(out.skillOverrides, name)) out.skillOverrides[name] = skillState;
          }
        } else if (key === 'enabledMcpjsonServers' || key === 'disabledMcpjsonServers') {
          if (!Array.isArray(out[key])) out[key] = [];
          if (Array.isArray(value)) {
            for (const item of value) {
              if (!out[key].includes(item)) out[key].push(item);
            }
          }
        } else if (['fallbackModel', 'modelPicker', 'availableModels', 'modelSettings'].includes(key)) {
          if (!Object.prototype.hasOwnProperty.call(out, key)) out[key] = clone(value);
        } else if (!Object.prototype.hasOwnProperty.call(out, key)) {
          out[key] = clone(value);
        }
      }
    }
    const dangerLayers = activeSources().filter((src) => hasAt(docs[src], 'skipDangerousModePermissionPrompt'));

      out.skipDangerousModePermissionPrompt = dangerLayers.some((src) => docs[src].skipDangerousModePermissionPrompt === true);

  function scalarSources(path) {
    const list = activeSources()

    if (path === 'permissions.defaultMode') {

    if (path === 'skipDangerousModePermissionPrompt') {
      const anyTrue = list.some((x) => x.value === true);

    }
    return list.map((item, i) => ({ ...item, active: i === activeIdx }));

      const dm = getAt(doc, 'permissions.defaultMode');
      if (dm === 'auto' || dm === 'bypassPermissions') {
        add('permissions.defaultMode', `项目级 ${dm} 不生效；实际会回落到较低层的有效值`, 'warn');
      }
    }
    return out;
  }

  function scopeIssues(doc, target, baseDoc) {
    const cur = scopeIssuesRaw(doc, target);
    const base = baseDoc ? scopeIssuesRaw(baseDoc, target) : [];
    return cur.map((issue) => ({
      ...issue,
      isNew: !base.some((b) => b.path === issue.path && b.msg === issue.msg && b.sev === issue.sev)
    }));
  }

  function managedKeyChanges(doc, base) {
    return ACCESS_MANAGED_ENV.filter((k) => JSON.stringify(getAt(doc, `env.${k}`)) !== JSON.stringify(getAt(base, `env.${k}`)));
  }

  function validateDoc(doc) {
    const errors = [];
    const add = (path, msg) => errors.push({ path, msg });
    if (!isObj(doc)) {
      add('(根节点)', '配置根节点必须是一个 JSON 对象');
      return errors;
    }
    if (hasAt(doc, 'model') && typeof doc.model !== 'string') add('model', 'model 必须是字符串');
    if (hasAt(doc, 'fallbackModel')) {
      if (!Array.isArray(doc.fallbackModel) || doc.fallbackModel.some((x) => typeof x !== 'string' || !x.trim())) {
        add('fallbackModel', 'fallbackModel 必须是非空字符串数组');
      }
    }
    if (hasAt(doc, 'effortLevel') && !['low', 'medium', 'high', 'xhigh'].includes(doc.effortLevel)) {
      add('effortLevel', 'effortLevel 只能是 low / medium / high / xhigh');
    }
    if (hasAt(doc, 'env')) {
      if (!isObj(doc.env)) add('env', 'env 必须是对象');
      else {
        for (const [k, v] of Object.entries(doc.env)) {
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) add(`env.${k}`, '环境变量名只能包含字母、数字、下划线，且不能以数字开头');
          if (typeof v !== 'string') add(`env.${k}`, '环境变量值必须是字符串');
        }
      }
    }
    if (hasAt(doc, 'permissions')) {
      if (!isObj(doc.permissions)) add('permissions', 'permissions 必须是对象');
      else {
        const p = doc.permissions;
        if (hasAt(p, 'defaultMode') && typeof p.defaultMode !== 'string') add('permissions.defaultMode', 'defaultMode 必须是字符串');
        for (const key of ['allow', 'ask', 'deny', 'additionalDirectories']) {
          if (!hasAt(p, key)) continue;
          if (!Array.isArray(p[key]) || p[key].some((x) => typeof x !== 'string' || !x.trim())) {
            add(`permissions.${key}`, `${key} 必须是非空字符串数组`);
          }
          if (key === 'additionalDirectories') {
            for (const v of p[key] || []) {
              if (!(v.startsWith('/') || v.startsWith('~/'))) add(`permissions.${key}`, `目录必须是绝对路径或 ~/ 开头：${v}`);
            }
          }
        }
      }
    }
    if (hasAt(doc, 'statusLine')) {
      if (!isObj(doc.statusLine)) add('statusLine', 'statusLine 必须是对象');
      else {
        if (doc.statusLine.type !== 'command') add('statusLine.type', '本期只支持 type=command');
        if (!doc.statusLine.command || typeof doc.statusLine.command !== 'string') add('statusLine.command', '状态栏命令不能为空');
      }
    }
    if (hasAt(doc, 'cleanupPeriodDays')) {
      const v = doc.cleanupPeriodDays;
      if (!Number.isInteger(v) || v < 1) add('cleanupPeriodDays', '保留天数必须是 ≥1 的整数');
    }
    if (hasAt(doc, 'enabledPlugins')) {
      if (!isObj(doc.enabledPlugins)) add('enabledPlugins', 'enabledPlugins 必须是对象');
      else {
        for (const [id, v] of Object.entries(doc.enabledPlugins)) {
          if (typeof v !== 'boolean') add(`enabledPlugins.${id}`, '插件开关必须是布尔值');
        }
      }
    }
    if (hasAt(doc, 'skillOverrides')) {
      if (!isObj(doc.skillOverrides)) add('skillOverrides', 'skillOverrides 必须是对象');
      else {
        for (const [name, v] of Object.entries(doc.skillOverrides)) {
          if (!name || name === '__proto__') add(`skillOverrides.${name}`, '该 Skill 名不能写入配置');
          if (!SKILL_STATES.some((s) => s[0] === v)) add(`skillOverrides.${name}`, 'Skill 状态只能是 on / name-only / user-invocable-only / off');
        }
      }
    }
    for (const key of ['enabledMcpjsonServers', 'disabledMcpjsonServers']) {
      if (!hasAt(doc, key)) continue;
      if (!Array.isArray(doc[key]) || doc[key].some((x) => typeof x !== 'string' || !x.trim())) {
        add(key, `${key} 必须是非空字符串数组`);
      }
    }
    return errors;
  }

  function liveGatewayModel() {
    const raw = getAt(docs.user, 'env.ANTHROPIC_MODEL');
    if (typeof raw === 'string' && raw.trim()) return raw.replace(/\[1m\]$/i, '');
    return state.access.model || GATEWAY_MODEL;
  }

  function modelWarning(value) {
    if (!value) return '';
    const base = String(value).replace(/\[1m\]$/i, '');
    const gw = liveGatewayModel();
    if (base === gw) return '';
    return `网关当前模型为 ${gw}；${value} 需先在逻辑模型页登记，否则网关可能返回 404。`;
  }

  /* =========================================================
     8. 拼装通用组件
     ========================================================= */
  function card(title, desc, body, extra = '') {
    return `<section class="card">
      <div class="card-head">
        <div><div class="card-title">${title}</div>${desc ? `<div class="card-desc">${desc}</div>` : ''}</div>
        ${extra ? `<div class="card-actions">${extra}</div>` : ''}
      </div>
      ${body}
    </section>`;
  }

  function fieldRow(label, control, hint = '', path = '') {
    const remove = path && hasAt(currentDoc(), path) && !ACCESS_MANAGED_ENV.includes(path.replace(/^env\./, ''))
      ? `<button class="x-mini" data-action="remove-key" data-path="${attr(path)}" title="移除本层设置">×</button>`
      : '';
    return `<div class="form-row">
      <div class="form-label">${esc(label)}${remove}</div>
      <div class="form-control">${control}${hint ? `<div class="hint">${hint}</div>` : ''}</div>
    </div>`;
  }

  function inheritedRow(label, path, displayValue, source, options = {}) {
    return `<div class="form-row">
      <div class="form-label">${esc(label)}</div>
      <div class="form-control">
        <div class="inherit-line">
          <span class="value mono">${esc(displayValue)}</span>
          <span class="badge">${icon('chevron', 10)}继承 · ${esc(sourceLabel(source))}</span>
          ${options.noOverride ? '' : `<button class="link-btn" data-action="override" data-path="${attr(path)}">在本层覆盖</button>`}
        </div>
        ${options.hint ? `<div class="hint">${options.hint}</div>` : ''}
      </div>
    </div>`;
  }

  function triControl(path, labels = {}) {
    const has = hasAt(currentDoc(), path);
    const val = getAt(currentDoc(), path);
    const inheritLabel = labels.inherit || '继承';
    const onLabel = labels.on || '开';
    const offLabel = labels.off || '关';
    const btn = (v, label, cls = '') => {
      const active = v === ''
        ? !has
        : (has && String(val) === v);
      return `<button class="${cls} ${active ? 'active' : ''}" data-action="tri" data-path="${attr(path)}" data-value="${v}">${esc(label)}</button>`;
    };
    return `<div class="tri" role="group" aria-label="${attr(path)}">
      ${btn('', inheritLabel)}
      ${btn('true', onLabel, 'on')}
      ${btn('false', offLabel)}
    </div>`;
  }

  function triWithHint(path, labels = {}, hint = '') {
    return `${triControl(path, labels)}${hint ? `<div class="hint">${hint}</div>` : ''}`;
  }

  function selectControl(path, options, emptyLabel = '继承') {
    const has = hasAt(currentDoc(), path);
    const val = getAt(currentDoc(), path);
    return `<select class="select" data-bind="${attr(path)}" data-empty="delete">
      <option value="" ${!has ? 'selected' : ''}>${esc(emptyLabel)}</option>
      ${options.map((o) => `<option value="${attr(o.value)}" ${has && String(val) === String(o.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }

  function numberControl(path, min, max, placeholder = '') {
    const val = hasAt(currentDoc(), path) ? getAt(currentDoc(), path) : '';
    return `<input class="input mono" type="number" data-bind="${attr(path)}" data-kind="number" value="${attr(val)}" ${min !== undefined ? `min="${min}"` : ''} ${max !== undefined ? `max="${max}"` : ''} placeholder="${attr(placeholder)}">`;
  }

  function textControl(path, opts = {}) {
    const val = hasAt(currentDoc(), path) ? getAt(currentDoc(), path) : '';
    return `<input class="input ${opts.mono ? 'mono' : ''}" data-bind="${attr(path)}" ${opts.emptyDelete ? 'data-empty="delete"' : ''} value="${attr(val)}" placeholder="${attr(opts.placeholder || '')}" ${opts.list ? `list="${attr(opts.list)}"` : ''}>`;
  }

  function chipsHTML(path, items, sourceMap = {}, opts = {}) {
    if (!items || items.length === 0) {
      return `<div class="hint">当前层未设置${opts.emptyHint ? ` · ${opts.emptyHint}` : ''}</div>`;
    }
    return `<div class="chips">${items.map((item, idx) => {
      const src = sourceMap[item];
      const move = opts.movable ? `
        <button class="x" data-action="move-chip" data-path="${attr(path)}" data-index="${idx}" data-dir="-1" title="上移" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button class="x" data-action="move-chip" data-path="${attr(path)}" data-index="${idx}" data-dir="1" title="下移" ${idx === items.length - 1 ? 'disabled' : ''}>↓</button>` : '';
      return `<span class="chip mono">${esc(item)}${src ? `<span class="mini-src">${esc(sourceLabel(src))}</span>` : ''}
        ${move}
        <button class="x" data-action="remove-chip" data-path="${attr(path)}" data-value="${attr(item)}" title="移除">×</button>
      </span>`;
    }).join('')}</div>`;
  }

  function inheritedChips(path, target = currentTarget()) {
    const currentArr = getAt(currentDoc(), path);
    const curSet = new Set(Array.isArray(currentArr) ? currentArr : []);
    const map = new Map();
    for (const src of lowerSources(target)) {
      const arr = getAt(docs[src], path);
      if (!Array.isArray(arr)) continue;
      for (const item of arr) {
        if (!curSet.has(item) && !map.has(item)) map.set(item, src);
      }
    }
    if (map.size === 0) return '';
    return `<div class="chips" style="margin-top:6px">${Array.from(map.entries()).map(([item, src]) =>
      `<span class="chip mono muted">${esc(item)}<span class="mini-src">${esc(sourceLabel(src))}</span></span>`
    ).join('')}</div>`;
  }

  function addRow(path, placeholder, buttonLabel = '添加') {
    return `<div class="rule-add">
      <input class="input mono" data-add-input="${attr(path)}" placeholder="${attr(placeholder)}">
      <button class="btn small" data-action="add-chip" data-path="${attr(path)}">${esc(buttonLabel)}</button>
    </div>`;
  }

  function managedPreviewHTML() {
    const a = state.access;
    const baseUrl = getAt(docs.user, 'env.ANTHROPIC_BASE_URL') || 'http://127.0.0.1:17890';
    const token = getAt(docs.user, 'env.ANTHROPIC_AUTH_TOKEN') || 'sk-agw-demo';
    const model = `${a.model}${a.oneM ? '[1M]' : ''}`;
    const lines = [
      ['ANTHROPIC_BASE_URL', baseUrl],
      ['ANTHROPIC_AUTH_TOKEN', maskText],
      ['ANTHROPIC_MODEL', model],
      ['ANTHROPIC_SMALL_FAST_MODEL', a.model],
      ...ROLE_DEFS.flatMap((r) => {
        const selected = a.roles[r.label] === '__follow__' ? a.model : (a.roles[r.label] || a.model);
        return r.nameKey ? [[r.key, selected], [r.nameKey, r.label]] : [[r.key, selected]];

    ];
    return lines.map(([k, v]) => `<span class="k">env.${esc(k)}</span> = <span class="v">"${esc(v)}"</span>`).join('\n');
  }

  function applyAccessToSettings() {
    const a = state.access;
    if (!isObj(docs.user.env)) docs.user.env = {};
    if (!isObj(baseline.user.env)) baseline.user.env = {};
    const model = `${a.model}${a.oneM ? '[1M]' : ''}`;
    const values = {
      ANTHROPIC_MODEL: model,
      ANTHROPIC_SMALL_FAST_MODEL: a.model
    };
    for (const r of ROLE_DEFS) {
      const selected = a.roles[r.label] === '__follow__' ? a.model : (a.roles[r.label] || a.model);
      values[r.key] = selected;
      if (r.nameKey) values[r.nameKey] = r.label;
    }
    for (const [k, v] of Object.entries(values)) {
      docs.user.env[k] = v;
      baseline.user.env[k] = v;
    }
    if (state.jsonTarget === 'user') {
      state.jsonDrafts.user = JSON.stringify(docs.user, null, 2);
      state.jsonDirty = false;
    }
  }

  function requestAccessApply() {
    if (!state.gatewayRunning) {
      toast('网关已停止，请先启动网关', 'warn');
      return;
    }
    if (state.dirty) {
      openModal({
        title: '先处理未保存的 Claude Code 设置',
        sub: '应用接入会重写受管键；当前设置区有未保存修改。',
        body: `<div>建议先保存或放弃设置，再应用接入，避免同一文件的两类修改交叠。</div>
          <div class="hint" style="margin-top:6px">${icon('info', 12)} 设置保存只改非受管键；接入应用只改受管键。</div>`,
        actions: [
          { label: '取消', kind: '', action: 'close' },
          { label: '去保存设置', kind: 'primary', action: 'focus-settings-save', autofocus: true }
        ]
      });
      modalActions['focus-settings-save'] = () => {
        closeModal();
        closeAccessDrawer();
        setTimeout(() => $('#save-btn')?.focus(), 30);
      };
      return;
    }
    const a = state.access;
    const model = `${a.model}${a.oneM ? '[1M]' : ''}`;
    openModal({
      title: '应用接入到 Claude Code？',
      sub: '只写入受管键；写前备份，其余设置原样保留。',
      body: `
        <div class="modal-kv"><div class="k">目标文件</div><div class="v mono">~/.claude/settings.json</div></div>
        <div class="modal-kv"><div class="k">接入配置</div><div class="v">${esc(a.config)}</div></div>
        <div class="modal-kv"><div class="k">网关模型</div><div class="v"><span class="mono">${esc(model)}</span>${a.oneM ? badge('act', '1M') : ''}</div></div>
        <div class="modal-kv"><div class="k">受管键</div><div class="v">${ACCESS_MANAGED_ENV.length} 个（Base URL、令牌、模型、SMALL_FAST、角色映射）</div></div>
        <div class="modal-kv"><div class="k">备份</div><div class="v mono">${esc(backupPath('user'))}</div></div>
        <div class="modal-kv"><div class="k">生效范围</div><div class="v">${badge('warn', '需重启 Claude Code')}<span class="hint" style="display:inline;margin-left:7px">环境变量与模型映射变更</span></div></div>
        <div class="hint" style="margin-top:9px">应用后受管键会立即更新；设置区若打开在用户级，会自动刷新。</div>
      `,
      width: 560,
      actions: [
        { label: '取消', kind: '', action: 'close' },
        { label: '应用', kind: 'primary', action: 'access-apply-confirm', autofocus: true, onClick: performAccessApply }
      ]
    });
  }

  function performAccessApply() {
    applyAccessToSettings();
    state.access.dirty = false;
    state.access.applied = true;
    state.access.lastApplied = `刚刚 ${nowClock()}`;
    state.accessDrawerOpen = false;
    closeModal();
    renderPage();
    toast('接入已应用，受管键已更新', 'success');
  }

  function saveAccessOnly() {
    state.access.dirty = false;
    state.access.applied = false;
    state.access.lastSaved = `刚刚 ${nowClock()}`;
    state.accessDrawerOpen = false;
    renderPage();
    toast('接入配置已保存；尚未应用到 Claude Code', 'info');
  }

  function fileStripHTML() {
    const target = currentTarget();
    let status = badge('ok', '已保存');
    if (state.view === 'json' && state.jsonError) status = badge('danger', 'JSON 有错误');
    else if (state.dirty && state.dirtyTarget === target) status = badge('warn', '有未保存修改');
    if (state.scope === 'managed') status = badge('lock', '只读');
    if (state.scope === 'project' && !currentProject()) status = badge('', '未选择项目');
    const path = state.scope === 'managed' ? '3 个来源 · 只读' : targetPath();
    return `<div class="file-strip">
      <span class="icon" style="color:var(--muted)">${icon('folder', 15)}</span>
      <span class="mono path">${esc(path || '—')}</span>
      ${status}
      ${state.scope === 'managed' ? '' : `<span class="last">上次保存：${esc(state.lastSaved[target] || '—')}</span>`}
      <span class="spacer"></span>
      ${state.scope === 'managed' ? '' : `<button class="text-btn" data-action="copy-path">复制路径</button>`}
    </div>`;
  }

  function scopeTabsHTML() {
    const tab = (value, label, sub, lock = false) => {
      const active = state.scope === value;
      return `<button class="seg-btn ${active ? 'active' : ''}" role="tab" aria-selected="${active}" data-action="scope" data-value="${value}">
        ${lock ? `<span class="lock-inline">${icon('lock', 11)}</span>` : ''}${esc(label)}
        <span class="seg-sub">${esc(sub)}</span>
      </button>`;
    };
    return `<div class="segmented" role="tablist" aria-label="配置层级">
      ${tab('user', '用户级', '~/.claude/settings.json')}

  function contextHTML() {
    if (state.scope === 'project') return projectContextHTML();
    const project = currentProject();
    return `<div class="context-card">
      <div class="context-note" style="margin-top:0">用户级设置对当前用户的所有 Claude Code 会话生效；项目共享/本地可以覆盖这里的值。${project ? `下方「合并后」提示基于当前项目 <b>${esc(project.name)}</b>。` : '当前未选择项目，合并提示只包含用户级与托管策略。'}</div>
    </div>`;
  }

  function projectContextHTML() {
    const project = currentProject();
    const options = allProjects().map((p) =>
      `<option value="${attr(p.id)}" ${state.projectId === p.id ? 'selected' : ''}>${esc(p.name)} — ${esc(shortPath(p.path))}</option>`
    ).join('');
    const fileTabs = project ? `<div class="file-tabs" role="tablist" aria-label="项目配置文件">
      <button class="file-tab ${state.projectFile === 'shared' ? 'active' : ''}" role="tab" aria-selected="${state.projectFile === 'shared'}" data-action="project-file" data-value="shared">
        ${icon('folder', 13)} 共享配置 <span class="mono">.claude/settings.json</span>
      </button>
      <button class="file-tab ${state.projectFile === 'local' ? 'active' : ''}" role="tab" aria-selected="${state.projectFile === 'local'}" data-action="project-file" data-value="local">
        ${icon('lock', 13)} 本地配置 <span class="mono">.claude/settings.local.json</span>
      </button>
    </div>` : '';

    let pathNote = '';
    if (project) {
      const resolved = state.projectFile === 'local' ? localPath() : sharedPath();
      const subdir = project.gitRoot && project.gitRoot !== project.path;
      pathNote = `<div class="path-line">${esc(resolved)}</div>`;
      if (state.projectFile === 'local' && subdir) {
        pathNote += `<div class="context-note">本地配置默认跟随 Git 仓库根；当前项目在子目录，因此实际写入 ${mono(project.gitRoot)} 下的 <span class="mono">.claude/settings.local.json</span>。</div>`;
      } else if (state.projectFile === 'shared') {
        pathNote += `<div class="context-note">共享文件跟随会话工作目录；若 Claude Code 在子目录启动，读取的是该子目录下的 <span class="mono">.claude/settings.json</span>。</div>`;
      } else {
        pathNote += `<div class="context-note">本地文件默认跟随 Git 仓库根；Windows、非 Git 仓库、家目录仓库等场景可能有例外。</div>`;
      }
    }

    return `<div class="context-card">
      <div class="context-row">
        <span class="context-label">项目</span>
        <select class="select" id="project-select" aria-label="选择项目">

          ${options}

      </div>
      ${fileTabs}
      ${pathNote}
    </div>`;
  }

      <div class="empty-title">选择一个项目</div>

      <div class="empty-actions">

  /* =========================================================
     10. 表单视图
     ========================================================= */
  function formView() {
    return `
      ${state.formErrors.length ? `<div class="error-box" id="form-errors">
        <div class="feedback-title">${icon('warning', 13)} 当前配置有 ${state.formErrors.length} 个问题</div>
        <ul class="modal-list">${state.formErrors.map((e) => `<li><span class="mono">${esc(e.path)}</span>：${esc(e.msg)}</li>`).join('')}</ul>
      </div>` : ''}
      <div class="hint" style="margin:-2px 0 10px">表单只编辑当前层；空白项显示「继承自下层」，不会把继承值写进当前文件。</div>
      ${modelCard()}
      ${envCard()}
      ${permissionsCard()}
      ${statusLineCard()}
      ${mcpCard()}
      ${skillsCard()}
      ${memoryCard()}
    `;
  }

  function modelCard() {
    const doc = currentDoc();
    const model = hasAt(doc, 'model') ? doc.model : undefined;
    const inherited = inheritedValue('model');
    let modelRow;

    if (model !== undefined) {
      const warn = modelWarning(model);
      const modelHint = warn
        ? `<span id="model-hint" class="hint warn">${esc(warn)}</span>`
        : `<span id="model-hint" class="hint">网关模型为 ${esc(liveGatewayModel())}。</span>`;
      modelRow = fieldRow('主模型', `
        <div class="inline-control">
          <input class="input mono" id="model-input" data-bind="model" data-empty="delete" value="${attr(model)}" list="model-suggestions" placeholder="例如 my-code / sonnet / opus">
          <button class="btn small" data-action="set-gateway-model">跟随网关</button>
        </div>
        <datalist id="model-suggestions">
          <option value="my-code"></option><option value="sonnet"></option><option value="opus"></option>
          <option value="haiku"></option><option value="fable"></option>
        </datalist>`, modelHint, 'model');
    } else if (inherited) {
      modelRow = inheritedRow('主模型', 'model', inherited.value, inherited.source, { hint: '当前层没有 model，显示的是下层继承值。' });
    } else {
      modelRow = fieldRow('主模型', `<div class="inline-control">
          <input class="input mono" data-bind="model" data-empty="delete" list="model-suggestions" placeholder="例如 my-code / sonnet">
          <button class="btn small" data-action="set-gateway-model">跟随网关</button>
        </div>
        <datalist id="model-suggestions">
          <option value="my-code"></option><option value="sonnet"></option><option value="opus"></option>
          <option value="haiku"></option><option value="fable"></option>
        </datalist>`, `当前层与下层都未设置；网关模型为 ${esc(liveGatewayModel())}。`, 'model');
    }

    const fallback = hasAt(doc, 'fallbackModel') ? doc.fallbackModel : undefined;
    const fallbackInherited = inheritedValue('fallbackModel');
    let fallbackRow;
    if (fallback !== undefined) {
      fallbackRow = fieldRow('回退模型', `${chipsHTML('fallbackModel', fallback, {}, { movable: true, emptyHint: '空数组表示不使用回退模型' })}
         ${addRow('fallbackModel', '添加回退模型，例如 haiku', '添加')}
         <div class="hint">按顺序尝试；整值替换，不跨层并集。</div>`, '', 'fallbackModel');
    } else if (fallbackInherited) {
      fallbackRow = inheritedRow('回退模型', 'fallbackModel', fallbackInherited.value.join(' → '), fallbackInherited.source, { hint: '当前层没有 fallbackModel，显示的是下层继承值。' });
    } else {
      fallbackRow = fieldRow('回退模型', `<div class="hint">当前层与下层都未设置。</div>${addRow('fallbackModel', '添加回退模型', '添加')}`, '整值替换，不跨层合并。', 'fallbackModel');
    }

    const effort = hasAt(doc, 'effortLevel') ? doc.effortLevel : undefined;
    const effortInherited = inheritedValue('effortLevel');
    let effortRow;
    if (hasAt(doc, 'effortLevel')) {
      effortRow = fieldRow('推理强度', `<select class="select" data-bind="effortLevel" data-empty="delete">
          <option value="">继承</option>
          ${['low','medium','high','xhigh'].map((v) => `<option value="${v}" ${effort === v ? 'selected' : ''}>${v}</option>`).join('')}
        </select>`, '修改后需重启 Claude Code。', 'effortLevel');
    } else if (effortInherited) {
      effortRow = inheritedRow('推理强度', 'effortLevel', effortInherited.value, effortInherited.source, { hint: '当前层没有 effortLevel，显示的是下层继承值；修改后需重启 Claude Code。' });
    } else {
      effortRow = fieldRow('推理强度', `<select class="select" data-bind="effortLevel" data-empty="delete">
            <option value="">继承</option><option value="low">low</option><option value="medium">medium</option>
            <option value="high">high</option><option value="xhigh">xhigh</option>
          </select>`, '修改后需重启 Claude Code。', 'effortLevel');
    }

    return card('模型与响应', '主模型、回退模型与推理强度', `
      ${modelRow}
      ${fallbackRow}
      ${effortRow}
      ${fieldRow('思考开关', triWithHint('alwaysThinkingEnabled', { on: '开启', off: '关闭', inherit: '继承' }, '缺省或开启 = 允许思考；修改后需重启。'), '', 'alwaysThinkingEnabled')}
      <div class="advanced-note">${icon('info', 13)}<div><b>高级模型键不在表单中：</b><span class="mono">modelPicker</span>、<span class="mono">availableModels</span>、<span class="mono">modelSettings</span>、<span class="mono">maxEffortLevel</span>。它们有整值替换或 scope 特殊规则，请用 <button class="link-btn" data-action="view" data-value="json">JSON 视图</button> 编辑。</div></div>
    `);
  }

  function inheritedValue(path) {
    for (const src of lowerSources()) {
      if (hasAt(docs[src], path)) return { value: getAt(docs[src], path), source: src };
    }
    return null;
  }

  function envCard() {
    const doc = currentDoc();
    const env = isObj(doc.env) ? doc.env : {};
    const allEntries = Object.entries(env);
    const target = currentTarget();
    const coreManagedEntries = allEntries.filter(([k]) => CORE_MANAGED_ENV.includes(k));
    const extraManagedEntries = allEntries.filter(([k]) => ACCESS_MANAGED_ENV.includes(k) && !CORE_MANAGED_ENV.includes(k));
    const normalEntries = allEntries.filter(([k]) => !ACCESS_MANAGED_ENV.includes(k));
    const visibleEntries = [
      ...coreManagedEntries,
      ...(state.managedExpanded ? extraManagedEntries : []),
      ...normalEntries
    ];
    const projectManaged = (state.scope === 'project') && allEntries.some(([k]) => ACCESS_MANAGED_ENV.includes(k));
    const managedMissing = target === 'user' && CORE_MANAGED_ENV.some((k) => !Object.prototype.hasOwnProperty.call(env, k));

    const rows = visibleEntries.map(([key, value]) => {
      const managed = ACCESS_MANAGED_ENV.includes(key);
      const secret = isSecretKey(key);
      const revealed = state.revealed.has(`${target}:${key}`);
      const inputType = secret && !revealed ? 'password' : 'text';
      return `<tr class="${managed ? 'managed' : ''}">
        <td class="col-key">
          <input class="input key-input" data-env-key="${attr(key)}" value="${attr(key)}" ${managed ? 'disabled' : ''}>
        </td>
        <td class="col-val">
          <div class="inline-control">
            <input class="input val-input" type="${inputType}" data-env-value="${attr(key)}" value="${attr(value)}" ${managed ? 'disabled' : ''}>
            ${secret ? `<button class="eye-btn" data-action="reveal-env" data-key="${attr(key)}" title="${revealed ? '隐藏' : '显示'}">${icon('eye', 14)}</button>` : ''}
          </div>
        </td>
        <td class="col-src">${managed ? lockBadge('接入投影') : ''}${key === 'ANTHROPIC_MODEL' && /\[1m\]$/i.test(String(value)) ? `<span class="badge act" style="margin-left:4px">1M</span>` : ''}</td>
        <td class="col-op">
          ${(secret || managed) ? `<button class="eye-btn" data-action="copy-env" data-key="${attr(key)}" title="复制值">${icon('copy', 13)}</button>` : ''}
          ${managed ? '' : `<button class="x-mini" data-action="remove-env" data-key="${attr(key)}" title="移除变量">×</button>`}
        </td>
      </tr>`;
    }).join('');

    const managedMore = extraManagedEntries.length
      ? `<div class="managed-more">
          <button class="link-btn" data-action="toggle-managed">${state.managedExpanded ? '收起' : `展开接入投影的其他 ${extraManagedEntries.length} 个键`}</button>
          <span class="hint" style="margin-left:6px">SMALL_FAST 与角色映射；全部由接入管理，不可在此修改。</span>
        </div>`
      : '';

    const inherited = inheritedEnvHTML();
    const mergedCount = Object.keys(mergedDoc().env || {}).length;

    let alerts = '';
    if (projectManaged) {
      alerts += `<div class="banner warn" style="margin:0 0 8px">${icon('warning')}<div><b>项目层出现了接入投影键。</b>项目级值会覆盖用户级接入配置，可能导致网关鉴权/路由异常。设置区不会改这些键，建议删除项目层覆盖后在接入抽屉中重新应用。</div></div>`;
    }
    if (managedMissing) {
      alerts += `<div class="banner warn" style="margin:0 0 8px">${icon('warning')}<div><b>受管键不完整。</b>用户级配置缺少 ${CORE_MANAGED_ENV.filter((k) => !Object.prototype.hasOwnProperty.call(env, k)).map((k) => `<span class="mono">${esc(k)}</span>`).join('、')}，接入可能未应用。<button class="link-btn" data-action="access-edit">打开接入</button></div></div>`;
    }

    return card('环境变量', `env 逐变量合并；接入投影共 ${ACCESS_MANAGED_ENV.length} 个键只读`, `
      ${alerts}
      <div class="banner info" style="margin:0 0 9px">${icon('lock')}<div><b>由本页「接入」管理：</b>Base URL、令牌、主模型、SMALL_FAST 与角色映射（共 ${ACCESS_MANAGED_ENV.length} 个键）。修改请打开 <button class="link-btn" data-action="access-edit">接入</button>。</div></div>
      <table class="env-table">
        <thead><tr><th class="col-key">变量名</th><th class="col-val">值</th><th class="col-src">状态</th><th class="col-op"></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4"><div class="hint" style="padding:6px 0">当前层没有环境变量。</div></td></tr>`}</tbody>
      </table>
      ${managedMore}
      <div class="env-add">
        <input class="input key mono" id="env-new-key" placeholder="NEW_VAR">
        <input class="input val mono" id="env-new-value" placeholder="值">
        <button class="btn small" data-action="add-env">添加变量</button>
      </div>
      <div class="hint">当前层 ${allEntries.length} 项；合并后 ${mergedCount} 项。<button class="link-btn" data-action="view" data-value="merge">查看合并预览</button> 敏感值默认遮蔽，显示后请勿截图分享。</div>
      ${inherited}
    `);
  }

  function inheritedEnvHTML() {
    const doc = currentDoc();
    const cur = isObj(doc.env) ? doc.env : {};
    const map = new Map();
    for (const src of lowerSources()) {
      const env = isObj(docs[src].env) ? docs[src].env : {};
      for (const [k, v] of Object.entries(env)) {
        if (!Object.prototype.hasOwnProperty.call(cur, k) && !map.has(k)) map.set(k, { value: v, source: src });
      }
    }
    if (map.size === 0) return '';
    const entries = Array.from(map.entries());

  function skillSourceLabel(source) {

  function skillEffective(item) {
    if (item.source === 'plugin') {
      const pluginOn = effectiveForMerge(`enabledPlugins.${item.plugin}`);
      const disabled = pluginOn === false;
      return { state: disabled ? 'off' : 'on', locked: 'plugin', note: disabled ? '插件已关闭' : '由插件管理', source: null };
    }
    const managedState = docs.managed.skillOverrides && docs.managed.skillOverrides[item.name];
    if (SKILL_STATES.some((s) => s[0] === managedState)) {
      return { state: managedState, locked: 'policy', note: '托管策略锁定', source: 'managed' };
    }
    if (item.lock === 'author') {
      return { state: 'user-invocable-only', locked: 'author', note: '作者锁定为仅手动', source: null };
    }
    const merged = mergedDoc();
    const effective = merged.skillOverrides && merged.skillOverrides[item.name];
    const source = activeSources().find((s) => docs[s].skillOverrides && Object.prototype.hasOwnProperty.call(docs[s].skillOverrides, item.name));
    return { state: effective || 'on', locked: null, note: null, source: source || null };
  }

  function skillsCard() {
    const doc = currentDoc();
    const known = new Set(INSTALLED_SKILLS.map((s) => s.name));
    const overrideNames = unique(activeSources().flatMap((src) => Object.keys(docs[src].skillOverrides || {})));
    const items = [
      ...INSTALLED_SKILLS,
      ...overrideNames.filter((name) => !known.has(name)).map((name) => ({
        name, source: 'unknown', desc: '未识别到本地 Skill；可能来自未加载的插件或已删除技能'
      }))
    ];

    const counts = { on: 0, off: 0, other: 0, locked: 0 };
    const rows = items.map((item) => {
      const eff = skillEffective(item);
      if (eff.state === 'on') counts.on += 1;
      else if (eff.state === 'off') counts.off += 1;
      else counts.other += 1;
      if (eff.locked) counts.locked += 1;

      const curOverride = doc.skillOverrides && Object.prototype.hasOwnProperty.call(doc.skillOverrides, item.name)
        ? doc.skillOverrides[item.name] : '';
      const canEdit = !eff.locked;
      const stateLabel = SKILL_STATE_LABEL[eff.state] || eff.state;
      const effectiveText = `生效：<b>${esc(stateLabel)}</b>${eff.source ? ` · ${esc(eff.source === 'managed' ? '托管' : sourceLabel(eff.source))}` : ''}`;
      const lockBadge = eff.locked === 'plugin' ? badge('lock', '由插件管理')
        : eff.locked === 'policy' ? badge('lock', '托管策略锁定')
          : eff.locked === 'author' ? badge('lock', '作者锁定') : '';
      const ignored = eff.locked && curOverride
        ? `<div class="plugin-meta" style="color:var(--warn)">当前层 skillOverrides=${esc(SKILL_STATE_LABEL[curOverride] || curOverride)}，${eff.locked === 'plugin' ? '插件来源不生效' : '锁定值优先'}。</div>` : '';
      const control = canEdit
        ? `<select class="select" data-skill-key="${attr(item.name)}" aria-label="${attr(item.name)} 状态">
            <option value="" ${!curOverride ? 'selected' : ''}>继承（未设置）</option>

      return `<div class="plugin-row skill-row">
        <div style="min-width:0">
          <div class="plugin-name">${esc(item.name)}${item.source === 'unknown' ? ` ${badge('warn', '未识别')}` : ''}</div>

        ${control}

    }).join('');

    const sharedWarn = state.scope === 'project' && state.projectFile === 'shared'
      ? `<div class="hint warn">当前为项目共享：Skills 开关会影响所有协作者，并可能随仓库提交。</div>` : '';

    return card('Skills', '按技能开启/关闭；插件来源的 Skills 由插件开关管理', `
      <div class="skill-summary">
        ${badge('ok', `开启 ${counts.on}`)}

  function syncGutter(text) {
    const gutter = $('#json-gutter');
    if (!gutter) return;
    const n = String(text || '').split('\n').length;
    let out = '';
    for (let i = 1; i <= Math.max(n, 1); i++) out += i + '\n';
    gutter.textContent = out.trimEnd();
  }

  function parseJSONError(text, err) {
    const msg = err && err.message ? err.message : 'JSON 语法错误';
    let line = null;
    let col = null;
    const lineCol = msg.match(/line\s+(\d+)\s+column\s+(\d+)/i);
    if (lineCol) {
      line = Number(lineCol[1]);
      col = Number(lineCol[2]);
    } else {
      const posMatch = msg.match(/position\s+(\d+)/i);
      if (posMatch) {
        const pos = Number(posMatch[1]);
        const before = text.slice(0, pos);
        line = before.split('\n').length;
        col = pos - before.lastIndexOf('\n');
      }
    }
    return { message: msg, line, col };
  }
