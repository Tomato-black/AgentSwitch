      let html = '';
      if (mChanges.length) {
        html += `<div class="error-box" style="margin:9px 0 0"><div class="feedback-title">${icon('lock', 13)} 受管键被修改</div>
          <div class="feedback-detail">${mChanges.map((k) => `<span class="mono">${esc(k)}</span>`).join('、')} 由本页「接入」管理，设置区不能修改。<button class="link-btn" data-action="access-edit">打开接入</button></div></div>`;
      }
      if (issues.length) {
        const errors = issues.filter((i) => i.sev === 'error');
        const warns = issues.filter((i) => i.sev !== 'error');
        html += `<div class="${errors.length ? 'error-box' : 'warn-box'}" style="margin:9px 0 0">
          <div class="feedback-title">${icon(errors.length ? 'warning' : 'info', 13)} ${errors.length ? 'Scope 校验未通过' : 'Scope 提示'}</div>
          <ul class="issue-list">
            ${issues.map((i) => `<li>${i.sev === 'error' ? badge('danger', '阻断') : badge('warn', '提示')}<span><span class="path">${esc(i.path)}</span>：${esc(i.msg)}${i.isNew ? '' : '（历史遗留，本次未改动）'}</span></li>`).join('')}
          </ul>
        </div>`;
      }
      if (!html) {
        html = `<div class="hint ok" style="margin:9px 0 0">${icon('check', 12)} 未发现 scope 或受管键问题。</div>`;
      }
      scopeBox.innerHTML = html;
    }
  }

  function onJSONInput(ta) {
    const target = currentTarget();
    state.jsonDrafts[target] = ta.value;
    state.jsonTarget = target;
    state.jsonDirty = true;
    syncGutter(ta.value);
    try {
      const parsed = JSON.parse(ta.value);
      if (!isObj(parsed)) {
        state.jsonError = { message: '根节点必须是一个 JSON 对象（不能是数组、字符串或 null）', line: 1, col: 1 };
        recomputeDirty();
        updateJSONPanels();
        return;
      }
      state.jsonError = null;
      docs[target] = parsed;
      state.formErrors = [];
      state.result = null;
      const r = $('#result-banner'); if (r) r.remove();
      recomputeDirty();
      updateJSONPanels();
    } catch (err) {
      state.jsonError = parseJSONError(ta.value, err);
      recomputeDirty();
      updateJSONPanels();
    }
  }

  /* =========================================================
     12. 合并预览视图
     ========================================================= */
  function mergeView() {
    const rows = buildMergeRows();
    const dirtyWarn = state.dirty
      ? `<div class="banner warn">${icon('warning')}<div><b>预览基于已保存内容。</b>当前有未保存修改，预览不包含草稿；保存后会更新。</div></div>`
      : '';
    return `
      ${dirtyWarn}
      <div class="banner info">${icon('info')}<div><b>优先级：</b>Managed &gt; <span class="mono">--settings</span> &gt; 项目本地 &gt; 项目共享 &gt; 用户级。<span class="muted">本次未检测到 <span class="mono">--settings</span>，不参与预览；远程托管策略不可见时可能不完整。</span></div></div>
      ${permissionEvalHTML()}
      <div class="card" style="padding-bottom:10px">
        <div class="merge-toolbar">
          <div class="search">${icon('search', 14)}<input class="input" id="merge-filter" placeholder="按键路径过滤，例如 permissions、env、model" value="${attr(state.mergeFilter)}"></div>
          <button class="btn small" data-action="merge-refresh">${icon('refresh', 13)} 刷新预览</button>
        </div>
        <div class="merge-legend" style="margin-bottom:6px">
          <span>来源：</span>${SOURCE_ORDER.map((s) => `<span class="badge ${s === 'managed' ? 'lock' : ''}">${s === 'managed' ? icon('lock', 10) : ''}${esc(sourceLabel(s))}</span>`).join('')}
          <span style="margin-left:6px">合并：</span><span class="badge">并集</span><span class="badge">逐变量</span><span class="badge">整值替换</span>
        </div>
        <table class="merge-table">
          <thead><tr><th style="width:31%">键</th><th>最终值</th><th style="width:116px;text-align:right">来源</th><th style="width:72px;text-align:right">合并</th><th class="merge-op"></th></tr></thead>
          <tbody id="merge-tbody">
            ${rows.map((path) => mergeRowHTML(path)).join('')}
          </tbody>
        </table>
        <div class="no-result" id="merge-no-result" style="display:none">${icon('search', 18)}<div style="margin-top:6px">没有匹配的键。<button class="link-btn" data-action="merge-clear">清除搜索</button></div></div>
      </div>
    `;
  }

  function buildMergeRows() {
    const paths = [];
    const add = (p) => { if (!paths.includes(p)) paths.push(p); };
    const merged = mergedDoc();

    ['model', 'fallbackModel', 'effortLevel', 'alwaysThinkingEnabled', 'skipDangerousModePermissionPrompt', 'permissions.defaultMode', 'statusLine',
      'enableAllProjectMcpServers', 'enabledMcpjsonServers', 'disabledMcpjsonServers',
      'autoCompactEnabled', 'autoMemoryEnabled', 'cleanupPeriodDays', 'availableModels', 'modelSettings'].forEach((p) => {
      if (hasAt(merged, p)) add(p);
    });

    for (const k of Object.keys(merged.env || {})) add(`env.${k}`);
    for (const decision of ['deny', 'ask', 'allow']) {
      if ((merged.permissions && merged.permissions[decision] || []).length) add(`permissions.${decision}`);
    }
    if ((merged.permissions && merged.permissions.additionalDirectories || []).length) add('permissions.additionalDirectories');
    for (const id of Object.keys(merged.enabledPlugins || {})) add(`enabledPlugins.${id}`);
    for (const name of Object.keys(merged.skillOverrides || {})) add(`skillOverrides.${name}`);
    for (const ev of Object.keys(merged.hooks || {})) add(`hooks.${ev}`);

    const order = [
      'model', 'fallbackModel', 'effortLevel', 'alwaysThinkingEnabled', 'skipDangerousModePermissionPrompt',
      'env.', 'permissions.defaultMode', 'permissions.deny', 'permissions.ask', 'permissions.allow', 'permissions.additionalDirectories',
      'statusLine', 'enabledPlugins.', 'skillOverrides.', 'enableAllProjectMcpServers', 'enabledMcpjsonServers', 'disabledMcpjsonServers',
      'hooks.', 'availableModels', 'modelSettings', 'autoCompactEnabled', 'autoMemoryEnabled', 'cleanupPeriodDays'
    ];
    const rank = (p) => {
      const i = order.findIndex((o) => (o.endsWith('.') ? p.startsWith(o) : p === o));
      return i === -1 ? 999 : i;
    };
    return paths.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  }

  function mergeRowHTML(path) {
    const kind = mergeKind(path);
    const value = effectiveForMerge(path);
    const contrib = contributionsFor(path);
    const sources = unique(
      path === 'skipDangerousModePermissionPrompt' || path.startsWith('skillOverrides.')
        ? contrib.entries.map((e) => e.source)
        : contrib.type === 'array'
          ? contrib.entries.map((e) => e.source)
          : contrib.type === 'hooks'
            ? contrib.entries.map((e) => e.source)
            : contrib.entries.filter((e) => e.active).map((e) => e.source)
    );
    const canExpand = contrib.entries.length > 0;
    const expanded = state.expanded.has(path);
    const detail = canExpand ? `<tr class="detail-row" data-detail-key="${attr(path)}" ${expanded ? '' : 'hidden'}>
      <td colspan="5">${mergeDetailHTML(path, contrib)}</td>
    </tr>` : '';
    return `<tr class="merge-row" data-key="${attr(path)}">
      <td><div class="merge-key">${esc(path)}</div></td>
      <td><div class="merge-value">${mergeValueHTML(path, value, kind)}</div></td>
      <td><div class="merge-src">${sources.slice(0, 2).map((s) => `<span class="badge ${s === 'managed' ? 'lock' : ''}" title="${attr(shortPath(sourcePath(s)))}">${s === 'managed' ? icon('lock', 9) : ''}${esc(sourceLabel(s))}</span>`).join('')}${sources.length > 2 ? `<span class="badge">+${sources.length - 2}</span>` : ''}</div></td>
      <td><div class="merge-kind">${esc(kind)}</div></td>
      <td class="merge-op">${canExpand ? `<button class="expand-btn" data-action="merge-expand" data-key="${attr(path)}" aria-expanded="${expanded}" aria-label="展开来源">${icon('chevron', 12)}</button>` : ''}</td>
    </tr>${detail}`;
  }

  function mergeValueHTML(path, value, kind) {
    if (value === undefined) return '<span class="muted">未设置</span>';
    if (path.startsWith('skillOverrides.')) {
      const label = SKILL_STATE_LABEL[value] || String(value);
      const tone = value === 'on' ? 'ok' : value === 'off' ? 'danger' : 'warn';
      const name = path.slice('skillOverrides.'.length);
      const item = INSTALLED_SKILLS.find((s) => s.name === name);
      return `${badge(tone, label)}${item && item.source === 'plugin' ? ` ${badge('lock', '插件不生效')}` : ''}`;
    }
    if (isSecretKey(path)) return `<span class="mono">${maskText}</span>`;
    if (Array.isArray(value)) {
      if (value.length === 0) return '<span class="muted">空数组</span>';
      if (kind === '整值替换') {
        return `<span class="muted">${value.length} 项：</span>${value.slice(0, 3).map((v) => `<span class="chip mono" style="margin:1px 2px">${esc(v)}</span>`).join('')}${value.length > 3 ? `<span class="badge">+${value.length - 3}</span>` : ''}`;
      }
      return `${value.slice(0, 3).map((v) => `<span class="chip mono" style="margin:1px 2px">${esc(v)}</span>`).join('')}${value.length > 3 ? `<span class="badge">+${value.length - 3}</span>` : ''}`;
    }
    if (typeof value === 'boolean') return value ? badge('ok', '开') : badge('', '关');
    if (isObj(value)) {
      if (path === 'statusLine') return `<span class="mono">${esc(summarizeStatusLine(value))}</span>`;
      if (path === 'modelSettings') return `<span class="muted">${Object.keys(value).length} 个模型设置</span>`;
      return `<span class="mono">{…}</span>`;
    }
    return `<span class="mono">${esc(value)}</span>`;
  }

  function mergeDetailHTML(path, contrib) {
    if (contrib.type === 'array') {
      return `<div class="contrib">
        <div class="contrib-title">并集去重；同一项保留最高层来源。</div>
        ${contrib.entries.map((e) => `<div class="contrib-row"><span class="src">${badge('', sourceLabel(e.source))} <span class="muted mono" style="font-size:10px">${esc(shortPath(sourcePath(e.source)))}</span></span><span class="val">${esc(e.value)}</span></div>`).join('')}
      </div>`;
    }
    if (contrib.type === 'hooks') {
      return `<div class="contrib">
        <div class="contrib-title">hooks 跨层累加；执行顺序以 Claude Code 实际行为为准。</div>
        ${contrib.entries.map((e) => `<div class="contrib-row"><span class="src">${badge('', sourceLabel(e.source))} <span class="muted mono" style="font-size:10px">${esc(shortPath(sourcePath(e.source)))}</span></span><span class="val">${esc((e.value || []).length)} 组</span><span class="grow"></span><span class="muted mono">${esc(JSON.stringify(e.value).slice(0, 120))}</span></div>`).join('')}
      </div>`;
    }
    const isOr = path === 'skipDangerousModePermissionPrompt';
    const isSkill = path.startsWith('skillOverrides.');
    const anyTrue = isOr && contrib.entries.some((e) => e.value === true);
    const orTitle = isOr
      ? (anyTrue
          ? '任一层为 true 即 true；false 不会覆盖其他层的 true。'
          : '所有层均为 false 或未设置，结果为「显示确认」。')
      : isSkill
        ? '逐技能合并；项目本地 > 项目共享 > 用户级；policy / flag / 作者 / 插件锁定优先。'
        : '各层贡献；被更高层覆盖的值保留可见。';
    const stateBadge = (e) => {
      if (!isOr) return e.active ? badge('ok', '生效') : badge('', '被覆盖');
      if (anyTrue) return e.value === true ? badge('ok', '生效') : badge('', 'false 不覆盖');
      return badge('', '均为 false');
    };
    return `<div class="contrib">
      <div class="contrib-title">${orTitle}</div>
      ${contrib.entries.map((e) => `<div class="contrib-row">
        <span class="src">${badge('', sourceLabel(e.source))} <span class="muted mono" style="font-size:10px">${esc(shortPath(sourcePath(e.source)))}</span></span>
        <span class="val ${e.active || (isOr && anyTrue) ? '' : 'inactive'}">${esc(displayContribution(e.value))}</span>
        <span class="grow"></span>
        ${stateBadge(e)}
      </div>`).join('')}
    </div>`;
  }

  function displayContribution(v) {
    if (Array.isArray(v)) return v.join(', ') || '空数组';
    if (isObj(v)) return JSON.stringify(v);
    if (typeof v === 'boolean') return v ? '开' : '关';
    if (v === undefined) return '未设置';
    return String(v);
  }

  function permissionEvalHTML() {
    const merged = mergedDoc();
    const p = merged.permissions || {};
    const counts = { deny: (p.deny || []).length, ask: (p.ask || []).length, allow: (p.allow || []).length };
    const dist = (decision) => activeSources().filter((s) => Array.isArray(getAt(docs[s], `permissions.${decision}`)) && getAt(docs[s], `permissions.${decision}`).length)
      .map((s) => `${sourceLabel(s)} ${getAt(docs[s], `permissions.${decision}`).length}`).join(' · ');
    return `<div class="perm-card">
      <div class="perm-card-head">
        <div><div class="perm-card-title">权限求值</div><div class="card-desc">deny → ask → allow，首个匹配决定；deny 任意层压过 allow 任意层。</div></div>
        <div style="margin-left:auto">${badge('plain', '只读')}</div>
      </div>
      <div class="eval-flow">
        <div class="eval-step deny"><div class="step-num">1</div><div class="step-name">deny · ${counts.deny} 条（去重）</div><div class="step-num">各层：${esc(dist('deny') || '无')}</div></div>
        <div class="eval-arrow">→</div>
        <div class="eval-step ask"><div class="step-num">2</div><div class="step-name">ask · ${counts.ask} 条（去重）</div><div class="step-num">各层：${esc(dist('ask') || '无')}</div></div>
        <div class="eval-arrow">→</div>
        <div class="eval-step allow"><div class="step-num">3</div><div class="step-name">allow · ${counts.allow} 条（去重）</div><div class="step-num">各层：${esc(dist('allow') || '无')}</div></div>
      </div>
      <div class="eval-note">规则的具体程度不影响顺序。项目级 <span class="mono">defaultMode</span> 写 <span class="mono">auto</span> / <span class="mono">bypassPermissions</span> 不生效；当前有效默认模式：<b>${esc(effectiveForMerge('permissions.defaultMode') || '未设置')}</b>。</div>
      <div class="eval-note" style="margin-top:4px">示例：<span class="mono">Read(./.env)</span> → <b>deny</b>（托管）；<span class="mono">Bash(git push:*)</span> → <b>ask</b>；<span class="mono">Read(./src/App.tsx)</span> → <b>allow</b>。</div>
    </div>`;
  }

  /* =========================================================
     13. 企业托管视图
     ========================================================= */
  function managedView() {
    return `
      ${resultBannerHTML()}
      ${managedSourcesHTML()}
      ${managedPolicyHTML()}
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">原始策略 JSON（本地可读部分）</div><div class="card-desc">敏感值已遮蔽；AgentSwitch 不会写入这些文件。</div></div>
          <div class="card-actions"><button class="btn small" data-action="managed-refresh">${icon('refresh', 13)} 刷新策略</button></div>
        </div>
        <pre class="json-readonly">${highlightJSON(JSON.stringify(maskSecrets(docs.managed), null, 2))}</pre>
      </div>
    `;
  }

  function managedSourcesHTML() {
    const cards = MANAGED_SOURCES.map((s) => {
      const hidden = s.status === 'hidden';
      return `<div class="source-card ${hidden ? 'hidden-source' : ''}">
        <div class="source-icon">${icon(hidden ? 'lock' : 'folder', 16)}</div>
        <div style="min-width:0">
          <div class="source-name">${esc(s.name)}</div>
          <div class="source-path">${esc(s.path)}</div>
          <div class="source-meta">${esc(s.kind)} · 修改时间 ${esc(s.modified)}</div>
        </div>
        ${hidden ? badge('warn', '不可见') : badge('ok', '已加载')}
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">策略来源</div><div class="card-desc">本地可读来源已加载；远程组织策略由 Claude Code 运行时合并，AgentSwitch 无法读取。</div></div>
      </div>
      ${cards}
      <div class="hint">${icon('info', 12)} 部分来源不可见时，下方「最终策略」可能不完整；以 Claude Code 实际运行为准。</div>
    </div>`;
  }

  function managedPolicyHTML() {
    const p = docs.managed.permissions || {};
    const deny = (p.deny || []).length;
    const ask = (p.ask || []).length;
    const allow = (p.allow || []).length;
    const envKeys = Object.keys(docs.managed.env || {});
    return `<div class="card">
      <div class="card-head">
        <div><div class="card-title">最终策略摘要</div><div class="card-desc">来自本地可读托管来源；用于解释「为什么某些设置改不动」。</div></div>
      </div>
      <div class="policy-grid">
        <div class="policy-item"><div class="policy-label">权限规则</div><div class="policy-value">${badge('danger', `deny ${deny}`)} ${badge('warn', `ask ${ask}`)} ${badge('ok', `allow ${allow}`)}</div></div>
        <div class="policy-item"><div class="policy-label">可用模型</div><div class="policy-value chips">${(docs.managed.availableModels || []).map((m) => `<span class="chip mono">${esc(m)}</span>`).join('') || '<span class="muted">未限制</span>'}</div></div>
        <div class="policy-item"><div class="policy-label">MCP 允许 / 拒绝</div><div class="policy-value chips">${(docs.managed.allowedMcpServers || []).map((m) => badge('ok', m)).join('')}${(docs.managed.deniedMcpServers || []).map((m) => badge('danger', m)).join('')}</div></div>
        <div class="policy-item"><div class="policy-label">环境变量</div><div class="policy-value">${envKeys.map((k) => `<span class="chip mono">${esc(k)}</span>`).join('') || '<span class="muted">无</span>'}</div></div>
        <div class="policy-item"><div class="policy-label">自动模式</div><div class="policy-value">${docs.managed.disableAutoMode === 'disable' ? badge('danger', '禁用 auto mode') : '<span class="muted">未限制</span>'}</div></div>
        <div class="policy-item"><div class="policy-label">受管插件</div><div class="policy-value chips">${Object.keys(docs.managed.enabledPlugins || {}).map((id) => `<span class="chip mono">${esc(id)}</span>`).join('') || '<span class="muted">无</span>'}</div></div>
      </div>
    </div>`;
  }

  function maskSecrets(value, path = '') {
    if (Array.isArray(value)) return value.map((v) => maskSecrets(v, path));
    if (isObj(value)) {
      const out = {};
      for (const [k, v] of Object.entries(value)) out[k] = maskSecrets(v, path ? `${path}.${k}` : k);
      return out;
    }
    if (path && isSecretKey(path.split('.').pop())) return maskText;
    return value;
  }

  function highlightJSON(text) {
    return esc(text)
      .replace(/(&quot;(?:\\.|[^&])*?&quot;)(\s*:)/g, '<span class="k">$1</span>$2')
      .replace(/:\s*(&quot;(?:\\.|[^&])*?&quot;)/g, ': <span class="s">$1</span>');
  }

  /* =========================================================
     14. 交互状态
     ========================================================= */
  function blockingJSONIssues() {
    if (state.view !== 'json') return [];
    const target = currentTarget();
    const issues = scopeIssues(currentDoc(), target, currentBaseline())
      .filter((i) => i.sev === 'error' && i.isNew)
      .map((i) => ({ kind: 'scope', path: i.path, msg: i.msg }));
    const m = managedKeyChanges(currentDoc(), currentBaseline())
      .map((k) => ({ kind: 'managed', path: `env.${k}`, msg: '由本页「接入」管理，请打开接入抽屉修改' }));
    return [...issues, ...m];
  }

  function canSave() {
    if (state.scope === 'managed') return false;
    if (state.scope === 'project' && !currentProject()) return false;
    if (!state.dirty) return false;
    if (state.view === 'json' && state.jsonError) return false;
    if (state.view === 'json' && blockingJSONIssues().length) return false;
    return true;
  }

  function updateChrome() {
    const save = $('#save-btn');
    if (save) {
      save.disabled = !canSave();
      const why = state.scope === 'managed'
        ? '企业托管配置只读'
        : !state.dirty
          ? '没有未保存的修改'
          : state.jsonError
            ? '先修复 JSON 错误'
            : (state.view === 'json' && blockingJSONIssues().length)
              ? '先修复 scope 或受管键问题'
              : '';
      save.title = save.disabled ? why : '保存当前层配置';
    }
    const strip = $('.file-strip');
    if (strip) {
      const target = currentTarget();
      let status = badge('ok', '已保存');
      if (state.scope === 'managed') status = badge('lock', '只读');
      else if (state.view === 'json' && state.jsonError) status = badge('danger', 'JSON 有错误');
      else if (state.dirty && state.dirtyTarget === target) status = badge('warn', '有未保存修改');
      else if (state.scope === 'project' && !currentProject()) status = badge('', '未选择项目');
      const old = strip.querySelector('.badge');
      if (old) old.outerHTML = status;
    }
  }

  function recomputeDirty() {
    const changed = diffPaths(currentBaseline(), currentDoc());
    const invalidJSON = state.view === 'json' && !!state.jsonError;
    state.dirty = changed.length > 0 || invalidJSON;
    state.dirtyTarget = state.dirty ? currentTarget() : null;
    updateChrome();
  }

  function markDirty() {
    state.result = null;
    state.formErrors = [];
    const r = $('#result-banner'); if (r) r.remove();
    if (state.view !== 'json') {
      state.jsonTarget = null;
      state.jsonDirty = false;
    }
    recomputeDirty();
  }

  function switchScope(next) {
    if (next === state.scope) return;
    const apply = () => {
      state.scope = next;
      state.result = null;
      state.formErrors = [];
      state.jsonError = null;
      if (next !== 'managed' && state.jsonTarget !== currentTarget()) {
        state.jsonDirty = false;
        state.jsonTarget = null;
      }
      if (next === 'managed') state.view = 'form';
      renderPage();
    };
    if (state.dirty) requestDiscard(apply);
    else apply();
  }

  function switchProjectFile(next) {
    if (next === state.projectFile) return;
    const apply = () => {
      state.projectFile = next;
      state.result = null;
      state.formErrors = [];
      state.jsonError = null;
      state.jsonDirty = false;
      state.jsonTarget = null;
      renderPage();
    };
    if (state.dirty) requestDiscard(apply);
    else apply();
  }

  function requestProjectChange(nextId) {
    const apply = () => {
      state.projectId = nextId;
      state.result = null;
      state.formErrors = [];
      state.jsonError = null;
      state.jsonDirty = false;
      state.jsonTarget = null;
      renderPage();
    };
    if (state.dirty) requestDiscard(apply);
    else apply();
  }

  function switchView(next) {
    if (next === state.view) return;
    if (state.view === 'json' && state.jsonError && next !== 'json') {
      toast('先修复 JSON 错误，或点击「重置」', 'warn');
      return;
    }
    if (state.view === 'json' && next !== 'json') {
      state.jsonDirty = false;
      state.jsonTarget = null;
    }
    if (next === 'json') {
      const target = currentTarget();
      if (state.jsonTarget !== target || !state.jsonDirty) {
        state.jsonDrafts[target] = JSON.stringify(currentDoc(), null, 2);
        state.jsonTarget = target;
        state.jsonDirty = false;
        state.jsonError = null;
      }
    }
    state.view = next;
    renderPage();
  }

  function requestDiscard(onDiscard) {
    pendingDiscard = onDiscard;
    openModal({
      title: '放弃未保存的修改？',
      sub: currentTargetPathLabel(),
      body: `<div>当前文件有未保存的修改。切换后这些修改会丢失。</div>
        <div class="hint" style="margin-top:6px">${icon('info', 12)} 保存后再切换，或选择「继续编辑」。</div>`,
      actions: [
        { label: '放弃修改', kind: 'danger', action: 'discard' },
        { label: '继续编辑', kind: 'primary', action: 'close', autofocus: true }
      ]
    });
  }

  function currentTargetPathLabel() {
    return state.scope === 'managed' ? '企业托管配置（只读）' : shortPath(targetPath());
  }

  function discardCurrent() {
    if (state.dirtyTarget) {
      docs[state.dirtyTarget] = clone(baseline[state.dirtyTarget]);
      state.jsonDrafts[state.dirtyTarget] = JSON.stringify(docs[state.dirtyTarget], null, 2);
    }
    state.dirty = false;
    state.dirtyTarget = null;
    state.jsonError = null;
    state.jsonDirty = false;
    state.formErrors = [];
    const fn = pendingDiscard;
    pendingDiscard = null;
    closeModal();
    if (typeof fn === 'function') fn();
    else renderPage();
  }

  /* =========================================================
     15. 保存
     ========================================================= */
  function openSaveModal() {
    if (state.scope === 'managed') {
      toast('企业托管配置只读', 'warn');
      return;
    }
    if (state.scope === 'project' && !currentProject()) {
      toast('请先选择一个项目', 'warn');
      return;
    }
    if (state.view === 'json' && state.jsonError) {
      toast('先修复 JSON 错误再保存', 'error');
      $('#json-text')?.focus();
      return;
    }
    const target = currentTarget();
    const doc = currentDoc();
    const base = currentBaseline();
    const formErrors = validateDoc(doc);
    if (formErrors.length) {
      showBlockingErrors('无法保存：配置校验未通过', formErrors);
      return;
    }
    const newScopeErrors = scopeIssues(doc, target, base).filter((i) => i.sev === 'error' && i.isNew);
    if (newScopeErrors.length) {
      showBlockingErrors('无法保存：Scope 校验未通过', newScopeErrors);
      return;
    }
    const mChanges = managedKeyChanges(doc, base);
    if (mChanges.length) {
      showBlockingErrors('无法保存：受管键不可修改', mChanges.map((k) => ({
        path: `env.${k}`,
        msg: '由本页「接入」管理，请打开接入抽屉修改；设置保存时会原样保留。'
      })));
      return;
    }
    const changed = diffPaths(base, doc);
    if (changed.length === 0) {
      toast('没有需要保存的修改', 'info');
      return;
    }
    const effect = computeEffect(target, changed);
    const path = targetPath();
    const backup = backupPath(target);
    const warnings = [];
    if (target === 'shared') warnings.push('项目共享文件通常会被提交到 Git；不要在这里写密钥。');
    if (target === 'shared' && hasSecretLikeValue(doc)) warnings.push('检测到疑似密钥或令牌；建议改存到项目本地 settings.local.json。');
    if (changed.includes('model') && hasAt(doc, 'model') && modelWarning(doc.model)) warnings.push(modelWarning(doc.model));
    const preExisting = scopeIssues(doc, target, base).filter((i) => !i.isNew);
    if (preExisting.length) warnings.push(`文件中有 ${preExisting.length} 个历史 scope 提示，本次未改动，会原样保留。`);

    const body = `
      <div class="modal-kv"><div class="k">目标文件</div><div class="v mono">${esc(path)}</div></div>
      <div class="modal-kv"><div class="k">变更键</div><div class="v"><div class="chips">${changed.slice(0, 8).map((k) => `<span class="chip mono">${esc(k)}</span>`).join('')}${changed.length > 8 ? `<span class="badge">等 ${changed.length} 个</span>` : ''}</div></div></div>
      <div class="modal-kv"><div class="k">备份</div><div class="v mono">${esc(backup)}</div></div>
      <div class="modal-kv"><div class="k">生效范围</div><div class="v">${badge(effect.kind === 'hot' ? 'ok' : 'warn', effect.label)}${effect.reason && effect.reason.length ? `<span class="hint" style="display:inline;margin-left:7px">${esc(effect.reason.join('、'))}</span>` : ''}</div></div>
      ${warnings.length ? `<div class="warn-box" style="margin-top:9px">${icon('warning', 13)}<div>${warnings.map((w) => `<div>${esc(w)}</div>`).join('')}</div></div>` : ''}
      <div class="hint" style="margin-top:9px">保存只修改当前层文件；不会合并写入其他层。未知键会原样保留。</div>
    `;
    openModal({
      title: `保存到${state.scope === 'user' ? '用户级' : target === 'shared' ? '项目共享' : '项目本地'}配置？`,
      sub: '写入前会备份当前文件；写入采用原子替换。',
      body,
      width: 560,
      actions: [
        { label: '取消', kind: '', action: 'close' },
        { label: '保存', kind: 'primary', action: 'save', autofocus: true, onClick: () => performSave({ target, changed, effect, path, backup }) }
      ]
    });
  }

  function hasSecretLikeValue(doc) {
    const env = isObj(doc.env) ? doc.env : {};
    for (const [k, v] of Object.entries(env)) {
      if (isSecretKey(k)) return true;
      if (typeof v === 'string' && /(sk-[A-Za-z0-9]{12,}|Bearer\s+[A-Za-z0-9._-]{12,})/.test(v)) return true;
    }
    return false;
  }

  function computeEffect(target, changed) {
    const restart = changed.filter((k) => RESTART_KEYS.includes(k));
    if (restart.length) {
      return { kind: 'restart', label: '需重启 Claude Code', reason: restart };
    }
    if (target !== 'user') {
      return { kind: 'next', label: '下次启动（该项目新会话）', reason: ['项目级配置'] };
    }
    if (changed.includes('permissions.blockReadsOutsideWorkingDirectories')) {
      return { kind: 'next', label: '下次启动', reason: ['permissions.blockReadsOutsideWorkingDirectories'] };
    }
    const unknown = changed.filter((k) => !HOT_PREFIXES.some((p) => k === p || k.startsWith(p)));
    if (unknown.length) {
      return { kind: 'next', label: '下次启动', reason: unknown.slice(0, 3) };
    }
    return { kind: 'hot', label: '已热生效', reason: changed.slice(0, 3) };
  }

  function performSave(info) {
    const btn = $('#modal-primary');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> 正在写入…`;
    }
    setTimeout(() => {
      baseline[info.target] = clone(docs[info.target]);
      state.dirty = false;
      state.dirtyTarget = null;
      state.jsonDirty = false;
      state.jsonDrafts[info.target] = JSON.stringify(docs[info.target], null, 2);
      state.formErrors = [];
      state.lastSaved[info.target] = `刚刚 ${nowClock()}`;
      state.result = {
        effect: info.effect,
        path: info.path,
        backup: info.backup,
        changed: info.changed
      };
      closeModal();
      renderPage();
      toast(`已保存到 ${shortPath(info.path)}`, 'success');
    }, 700);
  }

  function showBlockingErrors(title, errors) {
    openModal({
      title,
      sub: '修复后再保存；不会写入任何文件。',
      body: `<ul class="modal-list">${errors.map((e) => `<li><span class="mono">${esc(e.path)}</span>：${esc(e.msg)}</li>`).join('')}</ul>`,
      actions: [{ label: '去修复', kind: 'primary', action: 'close', autofocus: true }]
    });
  }

  /* =========================================================
     16. Modal / Toast
     ========================================================= */
  function openModal({ title, sub = '', body, actions = [], width = 520 }) {
    const root = $('#modal-root');
    modalActions = {};
    actions.forEach((a) => { if (a.onClick) modalActions[a.action] = a.onClick; });
    root.innerHTML = `<div class="modal-overlay" role="presentation">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${attr(title)}" style="width:min(${width}px,100%)">
        <div class="modal-head">
          <div class="modal-title">${esc(title)}</div>
          ${sub ? `<div class="modal-sub">${esc(sub)}</div>` : ''}
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">
          ${actions.map((a) => `<button class="btn ${a.kind || ''}" data-modal-action="${attr(a.action)}" ${a.autofocus ? 'data-autofocus="true"' : ''} ${a.action === 'save' ? 'id="modal-primary"' : ''}>${esc(a.label)}</button>`).join('')}
        </div>
      </div>
    </div>`;
    setTimeout(() => {
      const focus = root.querySelector('[data-autofocus="true"]') || root.querySelector('button');
      focus?.focus();
    }, 0);
  }

  function closeModal() {
    const root = $('#modal-root');
    if (root) root.innerHTML = '';
    modalActions = {};
    pendingDiscard = null;
  }

  function toast(message, kind = 'info') {
    const root = $('#toast-root');
    if (!root) return;
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = message;
    root.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(4px)';
      el.style.transition = 'opacity .18s, transform .18s';
      setTimeout(() => el.remove(), 220);
    }, 3200);
  }

  function copyText(text) {
    const done = () => toast('已复制到剪贴板', 'success');
    const fail = () => toast('复制失败，请手动选择路径复制', 'warn');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fail);
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy') ? done() : fail();
    } catch {
      fail();
    }
    ta.remove();
  }

  /* =========================================================
     17. 事件
     ========================================================= */
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'json-text') { onJSONInput(t); return; }
    if (t.id === 'merge-filter') { filterMerge(t.value); return; }
    if (t.dataset && t.dataset.bind) { onBindInput(t); return; }
    if (t.dataset && t.dataset.envValue) {
      const key = t.dataset.envValue;
      if (!isObj(currentDoc().env)) currentDoc().env = {};
      currentDoc().env[key] = t.value;
      markDirty();
      return;
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.accessField) {
      const field = t.dataset.accessField;
      if (field === 'oneM') state.access.oneM = !!t.checked;
      else if (field === 'model' || field === 'config') state.access[field] = t.value;
      state.access.dirty = true;
      renderAccessDrawer();
      return;
    }
    if (t.dataset && t.dataset.accessRole) {
      state.access.roles[t.dataset.accessRole] = t.value;
      state.access.dirty = true;
      renderAccessDrawer();
      return;
    }
    if (t.id === 'project-select') {
      const next = t.value === '__none__' ? null : t.value;
      if (next === state.projectId) return;
      t.value = state.projectId || '__none__';
      requestProjectChange(next);
      return;
    }
    if (t.dataset && t.dataset.skillKey) {
      const key = t.dataset.skillKey;
      const doc = currentDoc();
      if (!isObj(doc.skillOverrides)) doc.skillOverrides = {};
      if (!t.value) delete doc.skillOverrides[key];
      else doc.skillOverrides[key] = t.value;
      if (isObj(doc.skillOverrides) && Object.keys(doc.skillOverrides).length === 0) delete doc.skillOverrides;
      markDirty();
      renderPage();
      return;
    }
    if (t.dataset && t.dataset.bind && t.tagName === 'SELECT') {
      const path = t.dataset.bind;
      if (!t.value) deleteAt(currentDoc(), path);
      else setAt(currentDoc(), path, t.value);
      markDirty();
      renderPage();
      return;
    }
    if (t.dataset && t.dataset.envKey) {
      const oldKey = t.dataset.envKey;
      const newKey = t.value.trim();
      const env = currentDoc().env;
      if (!isObj(env)) return;
      if (newKey === oldKey) return;
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(newKey)) {
        toast('变量名只能包含字母、数字、下划线，且不能以数字开头', 'error');
        t.value = oldKey;
        return;
      }
      if (Object.prototype.hasOwnProperty.call(env, newKey)) {
        toast('当前层已存在同名变量', 'warn');
        t.value = oldKey;
        return;
      }
      if (ACCESS_MANAGED_ENV.includes(newKey)) {
        toast('该键由本页「接入」管理，不能在这里新增', 'warn');
        t.value = oldKey;
        return;
      }
      const entries = Object.entries(env).map(([k, v]) => [k === oldKey ? newKey : k, v]);
      const rebuilt = {};
      for (const [k, v] of entries) rebuilt[k] = v;
      currentDoc().env = rebuilt;
      markDirty();
      renderPage();
    }
  });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const value = btn.dataset.value;

    switch (action) {
      case 'nav':
        if (value !== 'access') toast('此原型只演示「Agent 接入」页', 'info');
        return;
      case 'agent-tab':
        if (state.agentTab === value) return;
        state.agentTab = value;
        state.accessDrawerOpen = false;
        renderPage();
        return;
      case 'access-edit':
        openAccessDrawer();
        return;
      case 'access-close':
      case 'access-close-overlay':
        closeAccessDrawer();
        return;
      case 'access-save':
        saveAccessOnly();
        return;
      case 'access-apply':
        requestAccessApply();
        return;
      case 'access-new':
        toast('原型中新建接入配置未展开；实际会创建一条新配置', 'info');
        return;
      case 'toggle-managed':
        state.managedExpanded = !state.managedExpanded;
        renderPage();
        return;
      case 'scope':
        switchScope(value);
        return;
      case 'project-file':
        switchProjectFile(value);
        return;
      case 'view':
        switchView(value);
        return;
      case 'save':
        openSaveModal();
        return;
      case 'refresh':
        renderPage();
        toast('已刷新文件状态（假数据）', 'info');
        return;
      case 'copy-path':
        copyText(state.scope === 'managed' ? MANAGED_SOURCE_PATH : targetPath());
        return;
      case 'copy-env': {
        const key = btn.dataset.key;
        const src = btn.dataset.source;
        const val = src ? getAt(docs[src], `env.${key}`) : (isObj(currentDoc().env) ? currentDoc().env[key] : undefined);
        if (val === undefined) toast('值不存在', 'warn');
        else copyText(String(val));
        return;
      }
      case 'go-access':
        openAccessDrawer();
        return;
      case 'open-help':
        openHelp();
        return;
      case 'open-rules':
        openRules();
        return;
      case 'pick-dir':
        openDirectoryPicker();
        return;
      case 'focus-project-select':
        $('#project-select')?.focus();
        return;
      case 'override':
        overrideKey(btn.dataset.path);
        return;
      case 'remove-key':
        removeKey(btn.dataset.path);
        return;
      case 'set-gateway-model':
        setAt(currentDoc(), 'model', liveGatewayModel());
        markDirty();
        renderPage();
        toast(`主模型已设为 ${liveGatewayModel()}`, 'success');
        return;
      case 'tri':
        setTri(btn.dataset.path, btn.dataset.value);
        return;
      case 'add-chip':
        addChip(btn.dataset.path);
        return;
      case 'remove-chip':
        removeChip(btn.dataset.path, btn.dataset.value);
        return;
      case 'move-chip':
        moveChip(btn.dataset.path, Number(btn.dataset.index), Number(btn.dataset.dir));
        return;
      case 'reveal-env':
        toggleReveal(btn.dataset.key);
        return;
      case 'add-env':
        addEnv();
        return;
      case 'remove-env':
        removeEnv(btn.dataset.key);
        return;
      case 'json-format':
        formatJSON();
        return;
      case 'json-validate':
        updateJSONPanels();
        toast('已完成 JSON 与 scope 校验', 'info');
        return;
      case 'json-reset':
        resetJSON();
        return;
      case 'merge-expand':
        toggleMergeDetail(btn.dataset.key, btn);
        return;
      case 'merge-refresh':
        renderPage();
        toast('合并预览已刷新（假数据）', 'info');
        return;
      case 'merge-clear':
        state.mergeFilter = '';
        renderPage();
        return;
      case 'managed-refresh':
        toast('已刷新托管策略（假数据）', 'info');
        return;
      case 'result-backup':
        if (state.result) {
          copyText(state.result.backup);
        }
        return;
      case 'result-dismiss':
        state.result = null;
        renderPage();
        return;
      case 'stop-gateway':
        state.gatewayRunning = !state.gatewayRunning;
        updateGatewayChrome();
        renderPage();
        toast(state.gatewayRunning ? '网关已启动' : '网关已停止；接入应用已禁用', state.gatewayRunning ? 'success' : 'warn');
        return;
      default:
        return;
    }
  });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-modal-action]');
    if (!btn) return;
    const action = btn.dataset.modalAction;
    const fn = modalActions[action];
    if (action === 'close') { closeModal(); return; }
    if (action === 'discard') { discardCurrent(); return; }
    if (typeof fn === 'function') fn();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#modal-root') && $('#modal-root').innerHTML.trim()) {
        closeModal();
      } else if (state.accessDrawerOpen) {
        closeAccessDrawer();
      }
    }
  });

  function onBindInput(t) {
    const path = t.dataset.bind;
    const doc = currentDoc();
    if (t.dataset.kind === 'number') {
      if (String(t.value).trim() === '') deleteAt(doc, path);
      else {
        const n = Number(t.value);
        if (Number.isFinite(n)) setAt(doc, path, n);
      }
    } else if (t.value === '' && t.dataset.empty === 'delete') {
      deleteAt(doc, path);
    } else {
      setAt(doc, path, t.value);
    }
    markDirty();
    if (path === 'model' || path === 'model' && t.id === 'model-input') {
      const hint = $('#model-hint');
      if (hint) {
        const w = modelWarning(t.value);
        hint.className = w ? 'hint warn' : 'hint';
        hint.textContent = w || `当前层未设置时继承下层；网关模型为 ${liveGatewayModel()}。`;
      }
    }
  }

  function setTri(path, value) {
    const doc = currentDoc();
    if (value === '') deleteAt(doc, path);
    else setAt(doc, path, value === 'true');
    markDirty();
    renderPage();
  }

  function addChip(path) {
    const input = $(`[data-add-input="${cssEscape(path)}"]`);
    if (!input) return;
    const value = input.value.trim();
    if (!value) { toast('请先输入内容', 'warn'); input.focus(); return; }
    if (path === 'permissions.additionalDirectories' && !(value.startsWith('/') || value.startsWith('~/'))) {
      toast('目录必须是绝对路径或 ~/ 开头', 'error');
      input.focus();
      return;
    }
    const doc = currentDoc();
    let arr = Array.isArray(getAt(doc, path)) ? getAt(doc, path) : [];
    if (arr.includes(value)) { toast('当前层已存在相同项', 'warn'); return; }
    arr = [...arr, value];
    setAt(doc, path, arr);
    markDirty();
    renderPage();
  }

  function removeChip(path, value) {
    const doc = currentDoc();
    let arr = Array.isArray(getAt(doc, path)) ? getAt(doc, path) : [];
    arr = arr.filter((x) => x !== value);
    if (path === 'fallbackModel' && arr.length === 0) deleteAt(doc, path);
    else setAt(doc, path, arr);
    markDirty();
    renderPage();
  }

  function moveChip(path, index, dir) {
    const doc = currentDoc();
    const arr = getAt(doc, path);
    if (!Array.isArray(arr)) return;
    const next = index + dir;
    if (next < 0 || next >= arr.length) return;
    const copy = [...arr];
    [copy[index], copy[next]] = [copy[next], copy[index]];
    setAt(doc, path, copy);
    markDirty();
    renderPage();
  }

  function toggleReveal(key) {
    const token = `${currentTarget()}:${key}`;
    if (state.revealed.has(token)) state.revealed.delete(token);
    else state.revealed.add(token);
    renderPage();
  }

  function addEnv() {
    const keyEl = $('#env-new-key');
    const valEl = $('#env-new-value');
    if (!keyEl || !valEl) return;
    const key = keyEl.value.trim();
    const value = valEl.value;
    if (!key) { toast('请填写变量名', 'warn'); keyEl.focus(); return; }
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) { toast('变量名只能包含字母、数字、下划线，且不能以数字开头', 'error'); keyEl.focus(); return; }
    if (ACCESS_MANAGED_ENV.includes(key)) { toast('该键由本页「接入」管理，请打开接入抽屉修改', 'warn'); return; }
    const doc = currentDoc();
    if (!isObj(doc.env)) doc.env = {};
    if (Object.prototype.hasOwnProperty.call(doc.env, key)) { toast('当前层已存在同名变量', 'warn'); return; }
    doc.env[key] = value;
    markDirty();
    renderPage();
  }

  function removeEnv(key) {
    if (ACCESS_MANAGED_ENV.includes(key)) { toast('受管键只读，请打开接入抽屉修改', 'warn'); return; }
    const doc = currentDoc();
    if (isObj(doc.env)) delete doc.env[key];
    markDirty();
    renderPage();
  }

  function overrideKey(path) {
    if (!path) return;
    const defaults = {
      model: liveGatewayModel(),
      fallbackModel: [],
      effortLevel: 'high',
      alwaysThinkingEnabled: true,
      statusLine: { type: 'command', command: '~/.claude/statusline.sh', padding: 0 },
      enableAllProjectMcpServers: true,
      syncClaudeAiPlugins: true,
      syncClaudeAiSkills: true,
      autoCompactEnabled: true,
      autoMemoryEnabled: true,
      cleanupPeriodDays: 30
    };
    let v = defaults[path];
    if (v === undefined) {
      if (path.startsWith('permissions.') && /\.(allow|ask|deny|additionalDirectories)$/.test(path)) v = [];
      else if (path.startsWith('enabledPlugins.')) v = true;
      else v = '';
    }
    setAt(currentDoc(), path, clone(v));
    markDirty();
    renderPage();
  }

  function removeKey(path) {
    if (!path) return;
    const leaf = path.replace(/^env\./, '');
    if (ACCESS_MANAGED_ENV.includes(leaf)) { toast('受管键只读，请打开接入抽屉修改', 'warn'); return; }
    deleteAt(currentDoc(), path);
    markDirty();
    renderPage();
  }

  function formatJSON() {
    if (state.jsonError) { toast('先修复 JSON 错误再格式化', 'error'); return; }
    const ta = $('#json-text');
    if (!ta) return;
    try {
      const parsed = JSON.parse(ta.value);
      const formatted = JSON.stringify(parsed, null, 2);
      ta.value = formatted;
      state.jsonDrafts[currentTarget()] = formatted;
      state.jsonDirty = true;
      docs[currentTarget()] = parsed;
      syncGutter(formatted);
      recomputeDirty();
      updateJSONPanels();
      toast('已格式化', 'success');
    } catch (err) {
      state.jsonError = parseJSONError(ta.value, err);
      updateJSONPanels();
      recomputeDirty();
    }
  }

  function resetJSON() {
    const target = currentTarget();
    openModal({
      title: '重置 JSON 编辑？',
      sub: '会丢弃当前 JSON 草稿，恢复到上次保存的内容。',
      body: `<div class="warn-box">${icon('warning', 13)}<div>未保存的修改将丢失。此操作不会写入磁盘。</div></div>`,
      actions: [
        { label: '重置', kind: 'danger', action: 'reset-json' },
        { label: '取消', kind: 'primary', action: 'close', autofocus: true }
      ]
    });
    modalActions['reset-json'] = () => {
      docs[target] = clone(baseline[target]);
      state.jsonDrafts[target] = JSON.stringify(docs[target], null, 2);
      state.jsonError = null;
      state.jsonDirty = false;
      state.dirty = false;
      state.dirtyTarget = null;
      closeModal();
      renderPage();
      toast('已恢复到上次保存内容', 'info');
    };
  }

  function toggleMergeDetail(key, btn) {
    if (state.expanded.has(key)) state.expanded.delete(key);
    else state.expanded.add(key);
    const detail = document.querySelector(`[data-detail-key="${cssEscape(key)}"]`);
    if (detail) detail.hidden = !state.expanded.has(key);
    if (btn) btn.setAttribute('aria-expanded', String(state.expanded.has(key)));
  }

  function filterMerge(q) {
    state.mergeFilter = q;
    const query = String(q || '').trim().toLowerCase();
    const rows = $$('.merge-row');
    const details = $$('.detail-row');
    let visible = 0;
    rows.forEach((row) => {
      const key = (row.dataset.key || '').toLowerCase();
      const show = !query || key.includes(query);
      row.style.display = show ? '' : 'none';
      if (show) visible++;
      const detail = document.querySelector(`[data-detail-key="${cssEscape(row.dataset.key)}"]`);
      if (detail) detail.style.display = show ? '' : 'none';
      if (!show && detail) detail.hidden = true;
    });
    const empty = $('#merge-no-result');
    if (empty) empty.style.display = visible === 0 ? 'block' : 'none';
  }

  function cssEscape(s) {
    if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(s);
    return String(s).replace(/["\\]/g, '\\$&');
  }

  /* =========================================================
     18. 说明 / 规则 / 目录选择
     ========================================================= */
  function openHelp() {
    openModal({
      title: '交互原型使用说明',
      sub: '所有数据均为假数据，不会读写真实文件。',
      body: `
        <div class="help-step"><div class="help-num">1</div><div><b>一个入口</b><br>侧栏「Agent 接入」进入；顶部 Agent 页签默认选中 Claude Code。接入与设置都在这一页。</div></div>
        <div class="help-step"><div class="help-num">2</div><div><b>接入摘要卡</b><br>卡片显示网关状态、当前接入配置、网关模型和是否已应用。点「编辑接入」打开右侧抽屉，改模型与角色映射。</div></div>
        <div class="help-step"><div class="help-num">3</div><div><b>应用接入</b><br>抽屉底部「保存并应用」只写受管键；应用后设置区的受管键会刷新。设置区有未保存修改时会先阻止应用。</div></div>
        <div class="help-step"><div class="help-num">4</div><div><b>编辑设置</b><br>下方「Claude Code 设置」可切换用户级/项目级/企业托管，并编辑权限（含默认开启的「危险模式确认」）、状态栏、插件与 Skills 开关；受管键与插件来源的 Skills 只读。</div></div>
        <div class="help-step"><div class="help-num">5</div><div><b>看合并结果</b><br>打开「合并预览」，每行显示最终值和来源文件；展开可看各层贡献，权限卡展示 deny → ask → allow。</div></div>
        <div class="help-step"><div class="help-num">6</div><div><b>试错误路径</b><br>JSON 视图里删掉一个括号看行列错误；在项目层 JSON 中加入 <span class="mono">modelPicker</span> 看 scope 阻断；修改受管 <span class="mono">ANTHROPIC_AUTH_TOKEN</span> 看受管键阻断。</div></div>
        <div class="help-step"><div class="help-num">7</div><div><b>试脏状态</b><br>改一个设置值后切换层级/项目，会弹「继续编辑 / 放弃修改」，默认安全动作是继续编辑；接入应用遇到未保存设置也会先提示。</div></div>
      `,
      width: 560,
      actions: [{ label: '知道了', kind: 'primary', action: 'close', autofocus: true }]
    });
  }

  function openRules() {
    openModal({
      title: '作用域规则',
      sub: '简化版；完整 30 键清单由实现期键注册表维护。',
      width: 700,
      body: `<table class="scope-table">
        <thead><tr><th>键 / 类别</th><th>用户级</th><th>项目共享</th><th>项目本地</th><th>托管</th></tr></thead>
        <tbody>
          <tr><td class="key">普通键</td><td class="yes">可写</td><td class="yes">可写</td><td class="yes">可写</td><td class="ro">只读</td></tr>
          <tr><td class="key">接入投影键（${ACCESS_MANAGED_ENV.length} 个）<br>env.ANTHROPIC_BASE_URL / AUTH_TOKEN / MODEL<br>SMALL_FAST / DEFAULT_* / SUBAGENT</td><td class="no">只读（接入）</td><td class="no">只读 + 覆盖警告</td><td class="no">只读 + 覆盖警告</td><td class="ro">只读</td></tr>
          <tr><td class="key">autoMode<br>modelPicker<br>sandbox.allowAppleEvents</td><td class="yes">可写</td><td class="no">禁用</td><td class="no">禁用</td><td class="ro">只读</td></tr>
          <tr><td class="key">skipDangerousModePermissionPrompt<br>syncClaudeAiPlugins<br>syncClaudeAiSkills<br>useAutoModeDuringPlan</td><td class="yes">可写</td><td class="no">禁用</td><td class="yes">可写</td><td class="ro">只读</td></tr>
          <tr><td class="key">skillOverrides<br>（逐技能状态）</td><td class="yes">可写</td><td class="yes">可写（影响协作者）</td><td class="yes">可写</td><td class="ro">逐键锁定</td></tr>
          <tr><td class="key">worktree.location</td><td class="yes">可写</td><td class="no">禁用</td><td class="no">禁用</td><td class="ro">只读</td></tr>
          <tr><td class="key">permissions.defaultMode<br>= auto / bypassPermissions</td><td class="yes">可写且生效</td><td class="no">写了不生效</td><td class="no">写了不生效</td><td class="ro">只读</td></tr>
          <tr><td class="key">cleanupPeriodDays</td><td class="yes">可写</td><td class="no">禁用</td><td class="no">禁用</td><td class="ro">只读</td></tr>
          <tr><td class="key">12 个 Global config 键<br>（~/.claude.json）</td><td class="ro" colspan="4">不在本页范围；设置区不读写</td></tr>
        </tbody>
      </table>
      <div class="hint" style="margin-top:9px">${icon('info', 12)} 已有违规键不会静默删除：历史遗留只警告并保留；本次新引入的违规键阻断保存。</div>
      <div class="hint" style="margin-top:5px">${icon('info', 12)} <span class="mono">skipDangerousModePermissionPrompt</span> 默认 true（AgentSwitch 默认）；合并按「任一层 true 即 true」，项目共享不可写。</div>
      <div class="hint" style="margin-top:5px">${icon('info', 12)} <span class="mono">skillOverrides</span> 按 Skill 名逐键；项目本地 > 项目共享 > 用户级。插件来源的 Skill 不能单关，需在「MCP 与插件」关闭插件；作者锁定最高只能到「仅手动调用」。</div>`,
      actions: [{ label: '关闭', kind: 'primary', action: 'close', autofocus: true }]
    });
  }

  function openDirectoryPicker() {
    openModal({
      title: '选择项目目录',
      sub: '原型不会真的打开系统目录选择器；可粘贴一个路径体验。',
      body: `<div class="form-row" style="border-top:0;padding-top:0">
        <div class="form-label">目录路径</div>
        <div class="form-control">
          <input class="input mono" id="custom-dir" placeholder="/Users/caozhang/work/my-project" value="/Users/caozhang/work/java_work/AgentSwitch">
          <div class="hint">选中后会读取该目录下的 <span class="mono">.claude/settings.json</span> 与仓库根的 <span class="mono">.claude/settings.local.json</span>。</div>
        </div>
      </div>`,
      actions: [
        { label: '取消', kind: '', action: 'close' },
        { label: '选择此目录', kind: 'primary', action: 'choose-dir', autofocus: true }
      ]
    });
    modalActions['choose-dir'] = () => {
      const input = $('#custom-dir');
      const p = input ? input.value.trim().replace(/[\\/]+$/, '') : '';
      if (!p) { toast('请填写目录路径', 'warn'); input?.focus(); return; }
      const existing = allProjects().find((x) => x.path === p);
      if (existing) {
        closeModal();
        requestProjectChange(existing.id);
        return;
      }
      const id = `custom-${Date.now()}`;
      const project = { id, name: basename(p), path: p, recent: '刚刚', gitRoot: p, note: '自定义目录' };
      state.customProjects.push(project);
      closeModal();
      requestProjectChange(id);
      toast(`已选择 ${basename(p)}`, 'success');
    };
  }

  /* =========================================================
     19. 初始化
     ========================================================= */
  // 图标注入（静态 sidebar）
  $$('[data-icon]').forEach((el) => {
    el.innerHTML = ICON_SVG[el.dataset.icon] || '';
  });

  // 全局默认：避免在页面里写死图标
  renderPage();
})();
</script>
