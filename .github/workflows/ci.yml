name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (offline, race)
        run: go test -race ./... -count=1
      - name: Cross-compile (windows/amd64)
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

  windows-build:
    name: Build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # 真实 Windows 工具链打包：exe + NSIS 安装包（runner 上自动下载 NSIS）。
      - name: Package (exe + installer)
        run: go tool mygo build -platform windows/amd64

  lint:
    name: Lint
    # golangci-lint 尚未支持 go 1.27（本仓库 go.mod 版本），追上前仅报告不阻塞
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
